
runtime:
  backend: cpu
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://127.0.0.1:2001
  - id: ue0
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2101
    rx_endpoint: tcp://127.0.0.1:2100
links:
  - from: gnb0
    to: ue0
    model: fading_chan
  - from: ue0
    to: gnb0
    model: fading_chan
models:
  fading_chan:
    chain:
      - type: tdl
        fading:
          f_d_max_hz: 350
          spectrum: jakes
          grid_us: 1.0
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            is_los: true
            los_k_db: 7.0
            los_angle_rad: 0.5
          - delay_samples: 5.0
            gain_db: -3.0

          real: 0.22
          imag: -0.30
        - tap: 0
          rx: 1
          tx: 0
          real: 0.26
          imag: 0.18
        - tap: 0
          rx: 2
          tx: 0
          real: 0.68
          imag: 0.21
        - tap: 0
          rx: 3
          tx: 0
          real: 0.31
          imag: -0.14
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0
  # UL column from ue3: one independent branch per gNB receive port, weighted toward port 3.
  ul_simo_1x4_ue3:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.17
          imag: 0.28
        - tap: 0
          rx: 1
          tx: 0
          real: 0.33
          imag: -0.22
        - tap: 0
          rx: 2
          tx: 0
          real: 0.20
          imag: 0.30
        - tap: 0
          rx: 3
          tx: 0
          real: 0.64

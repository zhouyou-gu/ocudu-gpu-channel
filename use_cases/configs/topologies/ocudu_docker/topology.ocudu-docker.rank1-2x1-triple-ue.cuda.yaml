# Docker rank-1 2x1 / 1x2 fixture with THREE srsUEs on one 2T2R cell
# (scripts/remote/ocudu-rank1-2x1-triple-ue-smoke.sh).
#
# Every UE keeps ONE antenna and the gNB keeps two ports, so per user the
# downlink is a 1x2 row and the uplink a 2x1 column -- rank-1 MISO/SIMO
# throughout, never 2x2.
#
# This is the widest superposition case in the repository: three uplink columns
# land on the same two gNB receive ports, so each gNB RX row is a three-term sum.
# The matrix checker reconstructs every row from all three incoming links and
# then removes them one at a time, requiring the match to break each time -- so
# a relay that dropped or double-counted any user cannot pass.
#
# The coefficients are chosen so no receive row is dominated by a single user
# and each user is weighted differently across the two ports; that keeps every
# removal test meaningful rather than trivially satisfied by one loud user.
#
# Claim boundary: four single-layer users sharing a cell in time, NOT same-PRB
# MU-MIMO. The emulator superposes whatever the scheduler actually transmits.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600

devices:
  - id: gnb0_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://*:2001
  - id: gnb0_p1
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2002
    rx_endpoint: tcp://*:2003
  - id: ue0_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2101
    rx_endpoint: tcp://*:2100
  - id: ue1_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2103
    rx_endpoint: tcp://*:2102
  - id: ue2_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2105
    rx_endpoint: tcp://*:2104

radio_nodes:
  - id: gnb0
    tx_ports:
      - gnb0_p0
      - gnb0_p1
    rx_ports:
      - gnb0_p0
      - gnb0_p1
  - id: ue0
    tx_ports:
      - ue0_p0
    rx_ports:
      - ue0_p0
  - id: ue1
    tx_ports:
      - ue1_p0
    rx_ports:
      - ue1_p0
  - id: ue2
    tx_ports:
      - ue2_p0
    rx_ports:
      - ue2_p0

links:
  - from: gnb0
    to: ue0
    model: dl_miso_2x1_ue0
  - from: gnb0
    to: ue1
    model: dl_miso_2x1_ue1
  - from: gnb0
    to: ue2
    model: dl_miso_2x1_ue2
  - from: ue0
    to: gnb0
    model: ul_simo_1x2_ue0
  - from: ue1
    to: gnb0
    model: ul_simo_1x2_ue1
  - from: ue2
    to: gnb0
    model: ul_simo_1x2_ue2

models:
  # DL row to ue0. |h0| carries the budget because srsRAN precodes rank-1 PDSCH onto port 0.
  dl_miso_2x1_ue0:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.80
          imag: 0.10
        - tap: 0
          rx: 0
          tx: 1
          real: 0.25
          imag: -0.15
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0
  # DL row to ue1. |h0| carries the budget because srsRAN precodes rank-1 PDSCH onto port 0.
  dl_miso_2x1_ue1:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.65
          imag: -0.20
        - tap: 0
          rx: 0
          tx: 1
          real: 0.30
          imag: 0.20
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0
  # DL row to ue2. |h0| carries the budget because srsRAN precodes rank-1 PDSCH onto port 0.
  dl_miso_2x1_ue2:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.55
          imag: 0.28
        - tap: 0
          rx: 0
          tx: 1
          real: 0.42
          imag: -0.18
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0
  # UL column from ue0: one independent branch per gNB receive port.
  ul_simo_1x2_ue0:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.75
          imag: -0.10
        - tap: 0
          rx: 1
          tx: 0
          real: 0.15
          imag: 0.25
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0
  # UL column from ue1: one independent branch per gNB receive port.
  ul_simo_1x2_ue1:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.35
          imag: 0.45
        - tap: 0
          rx: 1
          tx: 0
          real: 0.60
          imag: -0.25
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0
  # UL column from ue2: one independent branch per gNB receive port.
  ul_simo_1x2_ue2:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.20
          imag: -0.55
        - tap: 0
          rx: 1
          tx: 0
          real: 0.48
          imag: 0.30
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0

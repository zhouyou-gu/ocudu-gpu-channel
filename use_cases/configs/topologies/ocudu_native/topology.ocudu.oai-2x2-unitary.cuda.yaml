# 2x2 topology with a unitary DL matrix: the M6.4 acceptance fixture (layout as
# in topology.ocudu.oai-2x2.cuda.yaml; only dl_2x2 differs).
#
# One OCUDU gNB with two ports and one OAI nrUE with two ports, both declared
# as radio nodes, so the broker serves each node's ports from one window and
# one sample epoch. That is the precondition for a fixed 2x2 matrix: all four
# coefficients share one realization and one time origin (see MIMO_MILESTONES
# M6 for why rank-2 detection depends on it).
#
# Endpoints: the gNB runs in the gate namespace (loopback, 2000-2003, same
# contract as the 2T2R rank-1 gates); the OAI nrUE runs in the nested ue1
# namespace and reaches the broker over the veth pair (10.201.0.1 <-> .2).
# The UE owns REP TX binds 2101/2103 and connects its REQ RX channels to the
# broker's REP binds 2100/2102.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600

devices:
  - id: gnb0_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://127.0.0.1:2001
  - id: gnb0_p1
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2002
    rx_endpoint: tcp://127.0.0.1:2003
  - id: ue0_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://10.201.0.2:2101
    rx_endpoint: tcp://10.201.0.1:2100
  - id: ue0_p1
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://10.201.0.2:2103
    rx_endpoint: tcp://10.201.0.1:2102

radio_nodes:
  - id: gnb0
    tx_ports:
      - gnb0_p0
      - gnb0_p1
    rx_ports:
      - gnb0_p0
      - gnb0_p1
  - id: ue0
    tx_ports:
      - ue0_p0
      - ue0_p1
    rx_ports:
      - ue0_p0
      - ue0_p1

links:
  - from: gnb0
    to: ue0
    model: dl_2x2
  - from: ue0
    to: gnb0
    model: ul_2x2

models:
  # Unitary up to a 0.8 gain (condition number 1): a 25 degree rotation between
  # the ports with distinct per-entry phases. Every entry is non-zero, so each
  # RX row carries both TX ports (cross-term energy share sin^2(25 deg) = 0.18),
  # while the two layers stay perfectly separable. The OAI nrUE picks RI=2 only
  # when its CSI-RS condition-number metric is under 5 dB (csi_rx.c), which the
  # base fixture (condition 1.6) straddles; this one does not.
  dl_2x2:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.7214
          imag: 0.0724
        - tap: 0
          rx: 0
          tx: 1
          real: -0.2790
          imag: -0.1909
        - tap: 0
          rx: 1
          tx: 0
          real: 0.3230
          imag: -0.0999
        - tap: 0
          rx: 1
          tx: 1
          real: 0.7106
          imag: 0.1440
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0

  ul_2x2:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.75
          imag: -0.10
        - tap: 0
          rx: 0
          tx: 1
          real: 0.15
          imag: 0.10
        - tap: 0
          rx: 1
          tx: 0
          real: 0.10
          imag: -0.20
        - tap: 0
          rx: 1
          tx: 1
          real: 0.70
          imag: 0.15
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0

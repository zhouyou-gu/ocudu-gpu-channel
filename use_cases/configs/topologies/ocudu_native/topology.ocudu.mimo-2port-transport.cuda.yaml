# Native loopback form of the actual-OCUDU two-port transport fixture. Each
# Device is one Split-8 ZMQ port and each ordered RadioNode commits one shared
# sample epoch. This is transport-only evidence, not UE decode or rank-2.
#
# M5.3: adapted from the audited M1-era file. Two schema changes, no change of
# meaning -- the coefficients, endpoints and port order are as audited:
#   - `role:` removed from the radio_nodes entries; a node is an id and its two
#     ordered port lists, and writing order IS the matrix index.
#   - `rx_ports` / `tx_ports` removed from the fixed_mimo blocks; the matrix
#     dimensions come from the node declaration, which is the one place they are
#     stated (M1.2). The validator rejects an index outside them.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600

devices:
  # The native OCUDU gNB owns REP TX binds 2000/2002 and connects its REQ RX
  # channels to the broker's loopback REP binds 2001/2003.
  - id: gnb0_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://127.0.0.1:2001
  - id: gnb0_p1
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2002
    rx_endpoint: tcp://127.0.0.1:2003

  # The synthetic peer owns REP TX binds 2101/2103 and connects its REQ RX
  # channels to the broker's loopback REP binds 2100/2102.
  - id: peer0_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2101
    rx_endpoint: tcp://127.0.0.1:2100
  - id: peer0_p1
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2103
    rx_endpoint: tcp://127.0.0.1:2102

radio_nodes:
  - id: gnb0
    tx_ports:
      - gnb0_p0
      - gnb0_p1
    rx_ports:
      - gnb0_p0
      - gnb0_p1
  - id: peer0
    tx_ports:
      - peer0_p0
      - peer0_p1
    rx_ports:
      - peer0_p0
      - peer0_p1

links:
  - from: gnb0
    to: peer0
    model: dl_full_rank_fixed
  - from: peer0
    to: gnb0
    model: ul_full_rank_fixed

models:
  # Dense, non-diagonal and nonsingular, so each destination row depends on
  # both source ports rather than reducing this exercise to two 1x1 lanes.
  dl_full_rank_fixed:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.80
          imag: 0.10
        - tap: 0
          rx: 0
          tx: 1
          real: 0.25
          imag: -0.15
        - tap: 0
          rx: 1
          tx: 0
          real: -0.20
          imag: 0.30
        - tap: 0
          rx: 1
          tx: 1
          real: 0.90
          imag: -0.05
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0

  ul_full_rank_fixed:
    fixed_mimo:
      coefficients:
        - tap: 0
          rx: 0
          tx: 0
          real: 0.75
          imag: -0.10
        - tap: 0
          rx: 0
          tx: 1
          real: -0.30
          imag: 0.20
        - tap: 0
          rx: 1
          tx: 0
          real: 0.15
          imag: 0.25
        - tap: 0
          rx: 1
          tx: 1
          real: 0.85
          imag: 0.10
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0

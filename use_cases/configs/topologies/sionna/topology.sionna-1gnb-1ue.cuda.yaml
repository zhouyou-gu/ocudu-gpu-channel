# Rootless native 1-gNB / 1-UE topology driven by Sionna RT.
#
# Sionna replaces the two placeholder TDL profiles through the broker control
# endpoint. The broker keeps all sample-rate IQ processing on the CUDA path;
# Sionna runs only at the low-rate channel-update cadence.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://127.0.0.1:2001
  - id: ue0
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2101
    rx_endpoint: tcp://127.0.0.1:2100
links:
  - from: gnb0
    to: ue0
    model: sionna_rt
  - from: ue0
    to: gnb0
    model: sionna_rt
models:
  sionna_rt:
    chain:
      # Radios are started only after the first atomic Sionna profile update.
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: -100.0
            phase_rad: 0.0

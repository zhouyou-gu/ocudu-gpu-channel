# Native rank-1 4x1 DL MISO + 1x4 UL SIMO fixture (R3 complete): the R2
# 2T2R cell raised to FOUR antennas in BOTH directions. Everything the R2
# fixture header says still applies (ue_dedicated + DCI 0_1/1_1, CSI-RS off,
# MAC pcap off), plus the pusch.max_ue_mcs cap documented inline below --
# without it, UL 4R registration is a coin flip (root-caused 2026-08-17).
# The srsUE side stays nof_antennas = 1 throughout; claims stay rank-1.
# SPDX-FileCopyrightText: Copyright (C) 2021-2026 Software Radio Systems Limited
# SPDX-License-Identifier: BSD-3-Clause-Open-MPI
#
# Derived from OCUDU configs/gnb_rf_b210_fdd_srsUE.yml for Docker/ZMQ
# interop with ocudu-gpu-channel. Only the ru_sdr section is changed from
# UHD/external-clock hardware to ZMQ endpoints on the Docker bridge.

cu_cp:
  amf:
    addrs: 10.53.1.2
    port: 38412
    bind_addrs: 10.53.1.3
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq
  device_args: tx_port0=tcp://*:2000,tx_port1=tcp://*:2002,tx_port2=tcp://*:2004,tx_port3=tcp://*:2006,rx_port0=tcp://host.docker.internal:2001,rx_port1=tcp://host.docker.internal:2003,rx_port2=tcp://host.docker.internal:2005,rx_port3=tcp://host.docker.internal:2007,base_srate=23.04e6
  clock: default
  srate: 23.04
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  nof_antennas_dl: 4
  nof_antennas_ul: 4
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    dedicated:
      ss2_type: ue_dedicated
      dci_format_0_1_and_1_1: true
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  csi:
    csi_rs_enabled: false
  pucch:
    nof_cell_csi_res: 0
  pusch:
    mcs_table: qam64
    # max_ue_mcs is load-bearing, not tuning: with CSI-RS disabled (the srsUE
    # 2-port CSI-RS workaround) UL link adaptation runs on the gNB's own SNR
    # estimate, which saturates at ~11 dB on this noiseless digital channel
    # while the actual residual distortion does not follow AWGN statistics.
    # Uncapped, the gNB retries 16QAM/64QAM into a standing ~20% PUSCH KO
    # rate and registration survives only by luck (measured bimodal, worse
    # with more RX ports). Capped at 9, KO drops to zero and full 4T4R
    # attaches 3/3. See AGENT_PROGRESS.md R3 root-cause section.
    max_ue_mcs: 9

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: disable
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: enable
  ngap_filename: /tmp/gnb_ngap.pcap

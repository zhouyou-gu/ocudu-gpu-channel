# Control experiment: the ORIGINAL single-antenna multi-UE topology extended to
# four UEs. No MIMO anywhere -- gnb0 has one port, every UE has one port, and the
# model chains are the near/far ones from topology.ocudu-docker.multi-ue.cuda.yaml.
#
# Its only purpose is to answer whether the multi-UE attach limit is a property
# of the MIMO work or of the broker's multi-source behaviour, which upstream's
# own two-UE topology already relies on (gnb0 is a two-source destination there
# too). See docs/live-gate-results.md.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://*:2001
  - id: ue0
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2101
    rx_endpoint: tcp://*:2100
  - id: ue1
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2103
    rx_endpoint: tcp://*:2102
  - id: ue2
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2105
    rx_endpoint: tcp://*:2104
  - id: ue3
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2107
    rx_endpoint: tcp://*:2106
links:
  - from: gnb0
    to: ue0
    model: near
  - from: gnb0
    to: ue1
    model: mid1
  - from: gnb0
    to: ue2
    model: mid2
  - from: gnb0
    to: ue3
    model: far
  - from: ue0
    to: gnb0
    model: near
  - from: ue1
    to: gnb0
    model: mid1
  - from: ue2
    to: gnb0
    model: mid2
  - from: ue3
    to: gnb0
    model: far
models:
  near:
    chain:
      - type: path_loss
        path_loss_db: 6
      - type: phase
        phase_rad: 0.15
      - type: awgn
        snr_db: 30
  mid1:
    chain:
      - type: path_loss
        path_loss_db: 9
      - type: phase
        phase_rad: 0.28
      - type: awgn
        snr_db: 25
  mid2:
    chain:
      - type: path_loss
        path_loss_db: 12
      - type: phase
        phase_rad: 0.41
      - type: awgn
        snr_db: 20
  far:
    chain:
      - type: path_loss
        path_loss_db: 16
      - type: phase
        phase_rad: 0.55
      - type: awgn
        snr_db: 15

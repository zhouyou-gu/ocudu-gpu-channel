# Native rank-1 MISO/SIMO gNB fixture (R2 of RANK1_MILESTONES.md): the
# legacy B210 FDD srsUE cell raised to 2T2R, with the three adaptations the
# R2 controls established -- each one measured, none optional:
#
#   - pdcch.dedicated is ue_dedicated with DCI 0_1/1_1: OCUDU's validator
#     forbids nof_antennas_dl > 1 with fallback DCI in SS#2
#     (du_cell_config_validation.cpp:290), and the R2 1x1 control proved
#     srsUE attaches fine on the non-fallback formats.
#   - csi_rs_enabled: false + nof_cell_csi_res: 0: with 2 DL antennas OCUDU
#     builds a 2-port NZP-CSI-RS (FD-CDM2) that srsUE's PoC NR RRC cannot
#     apply ("Resource mapping is invalid or not implemented"), which kills
#     the whole connection-setup procedure. Disabling CSI-RS removes the
#     resource and srsUE attaches.
#   - pcap.mac_enable: disable: OCUDU rejects MAC pcap with >1 DL antenna.
#
# Claim boundary: this cell serves ONE UE layer. The srsUE side stays
# nof_antennas = 1; results are rank-1 2x1 DL MISO and 1x2 UL SIMO.
# SPDX-FileCopyrightText: Copyright (C) 2021-2026 Software Radio Systems Limited
# SPDX-License-Identifier: BSD-3-Clause-Open-MPI
#
# Derived from OCUDU configs/gnb_rf_b210_fdd_srsUE.yml for Docker/ZMQ
# interop with ocudu-gpu-channel. Only the ru_sdr section is changed from
# UHD/external-clock hardware to ZMQ endpoints on the Docker bridge.

cu_cp:
  amf:
    addrs: 127.0.0.2
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

cu_up:
  ngu:
    socket:
      - bind_addr: 127.0.0.1

ru_sdr:
  device_driver: zmq
  device_args: tx_port0=tcp://127.0.0.1:2000,tx_port1=tcp://127.0.0.1:2002,rx_port0=tcp://127.0.0.1:2001,rx_port1=tcp://127.0.0.1:2003,base_srate=23.04e6
  clock: default
  srate: 23.04
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  nof_antennas_dl: 2
  nof_antennas_ul: 2
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    dedicated:
      ss2_type: ue_dedicated
      dci_format_0_1_and_1_1: true
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  csi:
    csi_rs_enabled: false
  pucch:
    nof_cell_csi_res: 0
  pusch:
    mcs_table: qam64

log:
  filename: @GNB_LOG@
  all_level: info

pcap:
  mac_enable: disable
  mac_filename: @GNB_MAC_PCAP@
  ngap_enable: enable
  ngap_filename: @GNB_NGAP_PCAP@

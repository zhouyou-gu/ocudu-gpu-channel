# BISECT FIXTURE (control experiment, not a gate).
# One TX/RX antenna -- so the antenna count is the SISO baseline -- but carrying
# the cell settings the 2T2R rank-1 fixture had to adopt: ue_dedicated SS2 with
# DCI 0_1/1_1, CSI-RS off with nof_cell_csi_res 0, max_ue_mcs 9 and MAC pcap
# disabled. Used to separate 'multi-antenna' from 'the settings multi-antenna
# forced' as the cause of the four-UE attach failure.
# SPDX-FileCopyrightText: Copyright (C) 2021-2026 Software Radio Systems Limited
# SPDX-License-Identifier: BSD-3-Clause-Open-MPI
#
# Derived from OCUDU configs/gnb_rf_b210_fdd_srsUE.yml for Docker/ZMQ
# interop with ocudu-gpu-channel. Only the ru_sdr section is changed from
# UHD/external-clock hardware to ZMQ endpoints on the Docker bridge.

cu_cp:
  amf:
    addrs: 10.53.1.2
    port: 38412
    bind_addrs: 10.53.1.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://*:2000,rx_port=tcp://host.docker.internal:2001,base_srate=23.04e6
  clock: default
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    dedicated:
      ss2_type: ue_dedicated
      dci_format_0_1_and_1_1: true
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
    preamble_trans_max: 200
  pdsch:
    mcs_table: qam64
  csi:
    csi_rs_enabled: false
  pucch:
    nof_cell_csi_res: 0
  pusch:
    mcs_table: qam64
    max_ue_mcs: 9

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: disable
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: enable
  ngap_filename: /tmp/gnb_ngap.pcap

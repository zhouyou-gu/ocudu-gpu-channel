name: Deploy docs to GitHub Pages

# Pages is enabled on the repo with Source: GitHub Actions, so this fires on
# every push that touches the published docs. Before that it was manual-only,
# which meant docs/ changes shipped to main without the site ever rebuilding --
# the published page sat months behind the repo.
#
# workflow_dispatch is kept for forcing a redeploy without a docs change.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4

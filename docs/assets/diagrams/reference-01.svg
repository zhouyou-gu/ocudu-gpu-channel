<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 220" font-family="SF Mono,Menlo,monospace" font-size="11">
    <text x="500" y="20" fill="#cdd6e6" text-anchor="middle" font-size="12">Diagram conventions legend · 5 classes + 2 modifiers</text>

    <!-- HOST -->
    <rect x="30" y="50" width="150" height="50" rx="6" fill="#13391f" stroke="#6fd08c" stroke-width="1.6"/>
    <text x="105" y="72" fill="#6fd08c" text-anchor="middle" font-size="11">HOST</text>
    <text x="105" y="90" fill="#cdd6e6" text-anchor="middle" font-size="9">CPU work or host-RAM buffer</text>

    <!-- DEVICE -->
    <rect x="200" y="50" width="150" height="50" rx="6" fill="#0b101a" stroke="#5db1ff" stroke-width="1.6"/>
    <text x="275" y="70" fill="#5db1ff" text-anchor="middle" font-size="11">DEVICE</text>
    <text x="275" y="86" fill="#cdd6e6" text-anchor="middle" font-size="9">GPU kernel · device buffer</text>
    <text x="275" y="97" fill="#cdd6e6" text-anchor="middle" font-size="9">H2D · D2H copy</text>

    <!-- DECISION (diamond) -->
    <polygon points="445,50 520,75 445,100 370,75" fill="#0b101a" stroke="#ffb454" stroke-width="1.6"/>
    <text x="445" y="73" fill="#ffb454" text-anchor="middle" font-size="11">DECISION</text>
    <text x="445" y="87" fill="#cdd6e6" text-anchor="middle" font-size="9">gate · branch</text>

    <!-- STREAM -->
    <rect x="540" y="50" width="150" height="50" rx="6" fill="#0b101a" stroke="#ffb454" stroke-width="1.6"/>
    <text x="615" y="72" fill="#ffb454" text-anchor="middle" font-size="11">STREAM</text>
    <text x="615" y="90" fill="#cdd6e6" text-anchor="middle" font-size="9">shared sink (many→one)</text>

    <!-- EXTERNAL -->
    <rect x="710" y="50" width="150" height="50" rx="6" fill="#181f2e" stroke="#cdd6e6" stroke-width="1.6"/>
    <text x="785" y="72" fill="#cdd6e6" text-anchor="middle" font-size="11">EXTERNAL</text>
    <text x="785" y="90" fill="#cdd6e6" text-anchor="middle" font-size="9">SDR · ZMQ peer · 3rd-party</text>

    <text x="60" y="130" fill="#9aa7bd" font-size="10">Modifiers (apply on top of any class)</text>

    <!-- HIGHLIGHT modifier -->
    <rect x="30" y="140" width="150" height="50" rx="6" fill="rgba(255,180,84,0.18)" stroke="#ffb454" stroke-width="1.6"/>
    <text x="105" y="160" fill="#ffb454" text-anchor="middle" font-size="11">HIGHLIGHT</text>
    <text x="105" y="176" fill="#cdd6e6" text-anchor="middle" font-size="9">call-out slice</text>
    <text x="105" y="187" fill="#cdd6e6" text-anchor="middle" font-size="9">(translucent fill)</text>

    <!-- FALLBACK modifier -->
    <rect x="200" y="140" width="150" height="50" rx="6" fill="#0b101a" stroke="#6fd08c" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="275" y="160" fill="#6fd08c" text-anchor="middle" font-size="11">FALLBACK</text>
    <text x="275" y="176" fill="#cdd6e6" text-anchor="middle" font-size="9">dashed border</text>
    <text x="275" y="187" fill="#cdd6e6" text-anchor="middle" font-size="9">on-demand / optional</text>

    <text x="370" y="155" fill="#9aa7bd" font-size="10">Arrows</text>
    <line x1="370" y1="170" x2="430" y2="170" stroke="#5db1ff" stroke-width="1.6" marker-end="url(#leg_b)"/>
    <text x="438" y="173" fill="#cdd6e6" font-size="9">device transport (H2D / D2H)</text>
    <defs>
      <marker id="leg_b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5db1ff"/></marker>
      <marker id="leg_g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6fd08c"/></marker>
      <marker id="leg_a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ffb454"/></marker>
      <marker id="leg_n" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7bd"/></marker>
    </defs>
    <line x1="660" y1="170" x2="720" y2="170" stroke="#6fd08c" stroke-width="1.6" marker-end="url(#leg_g)"/>
    <text x="728" y="173" fill="#cdd6e6" font-size="9">host transport</text>
    <line x1="860" y1="170" x2="920" y2="170" stroke="#ffb454" stroke-width="1.6" marker-end="url(#leg_a)"/>
    <text x="928" y="173" fill="#cdd6e6" font-size="9">annotation</text>
  </svg>

<svg font-family="SF Mono,Menlo,monospace" font-size="12" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg">
<text fill="#9aa7bd" font-size="11" x="20" y="20">Diagram O · p99 model_mix latency vs edges per node · CPU vs CUDA · RTX 5090 · slot = 500 µs</text>
<!-- Y-axis -->
<line stroke="#9aa7bd" x1="80" x2="80" y1="50" y2="380"></line>
<line stroke="#9aa7bd" x1="80" x2="960" y1="380" y2="380"></line>
<!-- Y ticks: 0, 250, 500 (slot), 1000, 1500, 2000, 2500 -->
<g fill="#9aa7bd" font-size="10" text-anchor="end">
<text x="74" y="383">0</text>
<text x="74" y="350">250</text>
<text x="74" y="317">500</text>
<text x="74" y="251">1000</text>
<text x="74" y="185">1500</text>
<text x="74" y="119">2000</text>
<text x="74" y="53">2500</text>
</g>
<text fill="#9aa7bd" font-size="11" transform="rotate(-90 22 200)" x="22" y="200">p99 model_mix latency (µs)</text>
<!-- Reference bands (labels right-aligned so they stay inside viewBox) -->
<line stroke="#ffb454" stroke-dasharray="4 3" stroke-width="1" x1="80" x2="900" y1="317" y2="317"></line>
<text fill="#ffb454" font-size="10" text-anchor="end" x="990" y="320">500 µs = 1 slot</text>
<line stroke="#6fd08c" stroke-dasharray="3 3" stroke-width="1" x1="80" x2="900" y1="350" y2="350"></line>
<text fill="#6fd08c" font-size="10" text-anchor="end" x="990" y="353">125 µs = 25 % slot</text>
<!-- X labels (edges) -->
<g fill="#cdd6e6" font-size="11" text-anchor="middle">
<text x="180" y="403">2</text>
<text x="340" y="403">4</text>
<text x="500" y="403">6</text>
<text x="660" y="403">8</text>
<text x="820" y="403">16</text>
</g>
<text fill="#9aa7bd" font-size="11" text-anchor="middle" x="500" y="423">incoming edges per RX node (bench config)</text>
<!-- y_pixel(us) = 380 - us * (380-50)/2500 = 380 - us*0.132 -->
<!-- Superposition-mode (unified API) numbers:
         CPU p99:  295.1, 793.0, 832.7, 696.8, 2236.3
         CUDA p99: 64.6, 107.3, 92.5, 99.7, 226.7 -->
<g>
<!-- mvp-2-edge x=180 -->
<rect fill="rgba(111,208,140,0.40)" height="39.0" stroke="#6fd08c" width="20" x="158" y="341.0"></rect>
<rect fill="rgba(93,177,255,0.45)" height="8.5" stroke="#5db1ff" width="20" x="180" y="371.5"></rect>
<text fill="#6fd08c" font-size="9" text-anchor="middle" x="168" y="335">295</text>
<text fill="#5db1ff" font-size="9" text-anchor="middle" x="190" y="365">65</text>
<!-- multi-ue-4-edge x=340 -->
<rect fill="rgba(111,208,140,0.40)" height="104.7" stroke="#6fd08c" width="20" x="318" y="275.3"></rect>
<rect fill="rgba(93,177,255,0.45)" height="14.2" stroke="#5db1ff" width="20" x="340" y="365.8"></rect>
<text fill="#6fd08c" font-size="9" text-anchor="middle" x="328" y="269">793</text>
<text fill="#5db1ff" font-size="9" text-anchor="middle" x="350" y="359">107</text>
<!-- graph-6-edge x=500 -->
<rect fill="rgba(111,208,140,0.40)" height="109.9" stroke="#6fd08c" width="20" x="478" y="270.1"></rect>
<rect fill="rgba(93,177,255,0.45)" height="12.2" stroke="#5db1ff" width="20" x="500" y="367.8"></rect>
<text fill="#6fd08c" font-size="9" text-anchor="middle" x="488" y="264">833</text>
<text fill="#5db1ff" font-size="9" text-anchor="middle" x="510" y="361">93</text>
<!-- multi-gnb-8-edge x=660 -->
<rect fill="rgba(111,208,140,0.40)" height="92.0" stroke="#6fd08c" width="20" x="638" y="288.0"></rect>
<rect fill="rgba(93,177,255,0.45)" height="13.2" stroke="#5db1ff" width="20" x="660" y="366.8"></rect>
<text fill="#6fd08c" font-size="9" text-anchor="middle" x="648" y="282">697</text>
<text fill="#5db1ff" font-size="9" text-anchor="middle" x="670" y="360">100</text>
<!-- stress-16-edge x=820 -->
<rect fill="rgba(111,208,140,0.40)" height="295.4" stroke="#6fd08c" width="20" x="798" y="84.6"></rect>
<rect fill="rgba(93,177,255,0.45)" height="29.9" stroke="#5db1ff" width="20" x="820" y="350.1"></rect>
<text fill="#6fd08c" font-size="9" text-anchor="middle" x="808" y="78">2236</text>
<text fill="#5db1ff" font-size="9" text-anchor="middle" x="830" y="344">227</text>
</g>
<!-- Legend -->
<g font-size="11">
<rect fill="rgba(111,208,140,0.40)" height="10" stroke="#6fd08c" width="14" x="160" y="442"></rect>
<text fill="#9aa7bd" x="180" y="451">CPU backend (loop+sum on the host)</text>
<rect fill="rgba(93,177,255,0.45)" height="10" stroke="#5db1ff" width="14" x="540" y="442"></rect>
<text fill="#9aa7bd" x="560" y="451">CUDA backend (one fused superposition call per RX node)</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 470" font-family="SF Mono,Menlo,monospace" font-size="12">
    <text x="20" y="20" fill="#9aa7bd" font-size="11">Diagram O · p99 model_mix latency vs edges per node · CPU vs CUDA · RTX 5090 · slot = 500 µs</text>

    <!-- Y-axis -->
    <line x1="80" y1="50" x2="80" y2="380" stroke="#9aa7bd"/>
    <line x1="80" y1="380" x2="960" y2="380" stroke="#9aa7bd"/>

    <!-- Y ticks: 0, 250, 500 (slot), 1000, 1500, 2000, 2500 -->
    <g fill="#9aa7bd" font-size="10" text-anchor="end">
      <text x="74" y="383">0</text>
      <text x="74" y="350">250</text>
      <text x="74" y="317">500</text>
      <text x="74" y="251">1000</text>
      <text x="74" y="185">1500</text>
      <text x="74" y="119">2000</text>
      <text x="74" y="53">2500</text>
    </g>
    <text x="22" y="200" fill="#9aa7bd" font-size="11" transform="rotate(-90 22 200)">p99 model_mix latency (µs)</text>

    <!-- Reference bands (labels right-aligned so they stay inside viewBox) -->
    <line x1="80" y1="317" x2="900" y2="317" stroke="#ffb454" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="990" y="320" fill="#ffb454" font-size="10" text-anchor="end">500 µs = 1 slot</text>
    <line x1="80" y1="350" x2="900" y2="350" stroke="#6fd08c" stroke-dasharray="3 3" stroke-width="1"/>
    <text x="990" y="353" fill="#6fd08c" font-size="10" text-anchor="end">125 µs = 25 % slot</text>

    <!-- X labels (edges) -->
    <g fill="#cdd6e6" font-size="11" text-anchor="middle">
      <text x="180" y="403">2</text>
      <text x="340" y="403">4</text>
      <text x="500" y="403">6</text>
      <text x="660" y="403">8</text>
      <text x="820" y="403">16</text>
    </g>
    <text x="500" y="423" fill="#9aa7bd" font-size="11" text-anchor="middle">incoming edges per RX node (bench config)</text>

    <!-- y_pixel(us) = 380 - us * (380-50)/2500 = 380 - us*0.132 -->
    <!-- Superposition-mode (unified API) numbers:
         CPU p99:  295.1, 793.0, 832.7, 696.8, 2236.3
         CUDA p99: 64.6, 107.3, 92.5, 99.7, 226.7 -->

    <g>
      <!-- mvp-2-edge x=180 -->
      <rect x="158" y="341.0" width="20" height="39.0" fill="rgba(111,208,140,0.40)" stroke="#6fd08c"/>
      <rect x="180" y="371.5" width="20" height="8.5" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="168" y="335" fill="#6fd08c" font-size="9" text-anchor="middle">295</text>
      <text x="190" y="365" fill="#5db1ff" font-size="9" text-anchor="middle">65</text>

      <!-- multi-ue-4-edge x=340 -->
      <rect x="318" y="275.3" width="20" height="104.7" fill="rgba(111,208,140,0.40)" stroke="#6fd08c"/>
      <rect x="340" y="365.8" width="20" height="14.2" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="328" y="269" fill="#6fd08c" font-size="9" text-anchor="middle">793</text>
      <text x="350" y="359" fill="#5db1ff" font-size="9" text-anchor="middle">107</text>

      <!-- graph-6-edge x=500 -->
      <rect x="478" y="270.1" width="20" height="109.9" fill="rgba(111,208,140,0.40)" stroke="#6fd08c"/>
      <rect x="500" y="367.8" width="20" height="12.2" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="488" y="264" fill="#6fd08c" font-size="9" text-anchor="middle">833</text>
      <text x="510" y="361" fill="#5db1ff" font-size="9" text-anchor="middle">93</text>

      <!-- multi-gnb-8-edge x=660 -->
      <rect x="638" y="288.0" width="20" height="92.0" fill="rgba(111,208,140,0.40)" stroke="#6fd08c"/>
      <rect x="660" y="366.8" width="20" height="13.2" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="648" y="282" fill="#6fd08c" font-size="9" text-anchor="middle">697</text>
      <text x="670" y="360" fill="#5db1ff" font-size="9" text-anchor="middle">100</text>

      <!-- stress-16-edge x=820 -->
      <rect x="798" y="84.6" width="20" height="295.4" fill="rgba(111,208,140,0.40)" stroke="#6fd08c"/>
      <rect x="820" y="350.1" width="20" height="29.9" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="808" y="78" fill="#6fd08c" font-size="9" text-anchor="middle">2236</text>
      <text x="830" y="344" fill="#5db1ff" font-size="9" text-anchor="middle">227</text>
    </g>

    <!-- Legend -->
    <g font-size="11">
      <rect x="160" y="442" width="14" height="10" fill="rgba(111,208,140,0.40)" stroke="#6fd08c"/>
      <text x="180" y="451" fill="#9aa7bd">CPU backend (loop+sum on the host)</text>
      <rect x="540" y="442" width="14" height="10" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="560" y="451" fill="#9aa7bd">CUDA backend (one fused superposition call per RX node)</text>
    </g>
  </svg>

<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 280" font-family="SF Mono,Menlo,monospace" font-size="11">
    <defs>
      <marker id="arr_on" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#6fd08c"/>
      </marker>
      <marker id="arr_od" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#ffb454"/>
      </marker>
    </defs>

    <text x="500" y="20" fill="#cdd6e6" text-anchor="middle" font-size="12">Diagram N · 2 drivers → 2 timing sources → 1 stdout stream → results</text>

    <!-- Column labels -->
    <text x="120" y="48" fill="#9aa7bd" text-anchor="middle" font-size="10">DRIVER</text>
    <text x="380" y="48" fill="#9aa7bd" text-anchor="middle" font-size="10">TIMING SOURCE</text>
    <text x="640" y="48" fill="#9aa7bd" text-anchor="middle" font-size="10">STREAM</text>
    <text x="880" y="48" fill="#9aa7bd" text-anchor="middle" font-size="10">SINK</text>

    <!-- Row 1: broker (always-on) -->
    <rect x="40" y="60" width="160" height="44" rx="6" fill="#13391f" stroke="#6fd08c" stroke-width="2"/>
    <text x="120" y="80" fill="#6fd08c" text-anchor="middle" font-size="11">broker server loop</text>
    <text x="120" y="96" fill="#9aa7bd" text-anchor="middle" font-size="9">always-on, per slot</text>

    <line x1="200" y1="82" x2="260" y2="82" stroke="#6fd08c" stroke-width="1.6" marker-end="url(#arr_on)"/>

    <rect x="260" y="60" width="240" height="44" rx="6" fill="#0b101a" stroke="#5db1ff" stroke-width="2"/>
    <text x="380" y="78" fill="#5db1ff" text-anchor="middle" font-size="11">chrono::steady_clock</text>
    <text x="380" y="91" fill="#9aa7bd" text-anchor="middle" font-size="9">per-stage CPU µs</text>
    <text x="380" y="102" fill="#9aa7bd" text-anchor="middle" font-size="9">align / read / pack / throttle</text>

    <!-- Row 2: GPU work (DEVICE class) -->
    <rect x="40" y="118" width="160" height="44" rx="6" fill="#0b101a" stroke="#5db1ff" stroke-width="1.6"/>
    <text x="120" y="138" fill="#5db1ff" text-anchor="middle" font-size="11">GPU kernels</text>
    <text x="120" y="154" fill="#9aa7bd" text-anchor="middle" font-size="9">channel · superpose · rx</text>

    <line x1="200" y1="140" x2="260" y2="140" stroke="#5db1ff" stroke-width="1.6" marker-end="url(#arr_on_b)"/>

    <rect x="260" y="118" width="240" height="44" rx="6" fill="#0b101a" stroke="#5db1ff" stroke-width="1.6"/>
    <text x="380" y="138" fill="#5db1ff" text-anchor="middle" font-size="11">cudaEvent brackets</text>
    <text x="380" y="154" fill="#9aa7bd" text-anchor="middle" font-size="9">H2D / kernel / D2H per-phase µs</text>

    <!-- Row 3: bench (FALLBACK modifier on HOST class — dashed green) -->
    <rect x="40" y="176" width="160" height="44" rx="6" fill="#0b101a" stroke="#6fd08c" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="120" y="196" fill="#6fd08c" text-anchor="middle" font-size="11">bench CLI</text>
    <text x="120" y="212" fill="#9aa7bd" text-anchor="middle" font-size="9">on-demand · no ZMQ, no broker</text>

    <line x1="200" y1="198" x2="260" y2="160" stroke="#6fd08c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr_on)"/>
    <text x="232" y="190" fill="#6fd08c" font-size="9">reuses</text>

    <!-- Both timing sources merge into STREAM (stdout) -->
    <line x1="500" y1="82"  x2="560" y2="100" stroke="#9aa7bd" stroke-width="1.4" marker-end="url(#arr_grey)"/>
    <line x1="500" y1="140" x2="560" y2="120" stroke="#9aa7bd" stroke-width="1.4" marker-end="url(#arr_grey)"/>

    <!-- STREAM class: amber rect (shared sink) -->
    <rect x="560" y="80" width="160" height="64" rx="6" fill="#0b101a" stroke="#ffb454" stroke-width="1.6"/>
    <text x="640" y="100" fill="#ffb454" text-anchor="middle" font-size="11">stdout</text>
    <text x="640" y="116" fill="#cdd6e6" text-anchor="middle" font-size="9">event=cpu_stage_timings</text>
    <text x="640" y="128" fill="#cdd6e6" text-anchor="middle" font-size="9">event=gpu_timings · heartbeat</text>
    <text x="640" y="140" fill="#cdd6e6" text-anchor="middle" font-size="9">event=stats · stop · fatal</text>

    <!-- stdout → sink: log capture by harness -->
    <line x1="720" y1="112" x2="800" y2="112" stroke="#9aa7bd" stroke-width="1.4" marker-end="url(#arr_grey)"/>

    <!-- HOST class: results dir (host-side filesystem) -->
    <rect x="800" y="80" width="160" height="64" rx="6" fill="#13391f" stroke="#6fd08c" stroke-width="1.6"/>
    <text x="880" y="100" fill="#6fd08c" text-anchor="middle" font-size="11">results/reports/</text>
    <text x="880" y="116" fill="#cdd6e6" text-anchor="middle" font-size="9">CSV + JSON aggregates</text>
    <text x="880" y="128" fill="#cdd6e6" text-anchor="middle" font-size="9">scripts/remote/perf-*.sh</text>
    <text x="880" y="140" fill="#cdd6e6" text-anchor="middle" font-size="9">populates §20 + Diagram W</text>

    <!-- Legend (bottom) -->
    <g font-size="10">
      <line x1="60" y1="252" x2="84" y2="252" stroke="#6fd08c" stroke-width="1.6"/>
      <text x="92" y="256" fill="#9aa7bd">always-on (broker per-serve + 1 Hz heartbeat)</text>
      <line x1="480" y1="252" x2="504" y2="252" stroke="#6fd08c" stroke-width="1.6" stroke-dasharray="4 3"/>
      <text x="512" y="256" fill="#9aa7bd">on-demand fallback (bench CLI · §2.1 modifier)</text>
    </g>
    <defs>
      <marker id="arr_on_b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5db1ff"/></marker>
      <marker id="arr_grey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7bd"/></marker>
    </defs>
  </svg>

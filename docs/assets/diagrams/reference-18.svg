<svg font-family="SF Mono,Menlo,monospace" font-size="11" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr_on" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5">
<path d="M0,0 L9,4.5 L0,9 z" fill="#6fd08c"></path>
</marker>
<marker id="arr_od" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5">
<path d="M0,0 L9,4.5 L0,9 z" fill="#ffb454"></path>
</marker>
</defs>
<text fill="#cdd6e6" font-size="12" text-anchor="middle" x="500" y="20">Diagram N · 2 drivers → 2 timing sources → 1 stdout stream → results</text>
<!-- Column labels -->
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="120" y="48">DRIVER</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="380" y="48">TIMING SOURCE</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="640" y="48">STREAM</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="880" y="48">SINK</text>
<!-- Row 1: broker (always-on) -->
<rect fill="#13391f" height="44" rx="6" stroke="#6fd08c" stroke-width="2" width="160" x="40" y="60"></rect>
<text fill="#6fd08c" font-size="11" text-anchor="middle" x="120" y="80">broker server loop</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="120" y="96">always-on, per slot</text>
<line marker-end="url(#arr_on)" stroke="#6fd08c" stroke-width="1.6" x1="200" x2="260" y1="82" y2="82"></line>
<rect fill="#0b101a" height="44" rx="6" stroke="#5db1ff" stroke-width="2" width="240" x="260" y="60"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="380" y="78">chrono::steady_clock</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="380" y="91">per-stage CPU µs</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="380" y="102">align / read / pack / throttle</text>
<!-- Row 2: GPU work (DEVICE class) -->
<rect fill="#0b101a" height="44" rx="6" stroke="#5db1ff" stroke-width="1.6" width="160" x="40" y="118"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="120" y="138">GPU kernels</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="120" y="154">channel · superpose · rx</text>
<line marker-end="url(#arr_on_b)" stroke="#5db1ff" stroke-width="1.6" x1="200" x2="260" y1="140" y2="140"></line>
<rect fill="#0b101a" height="44" rx="6" stroke="#5db1ff" stroke-width="1.6" width="240" x="260" y="118"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="380" y="138">cudaEvent brackets</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="380" y="154">H2D / kernel / D2H per-phase µs</text>
<!-- Row 3: bench (FALLBACK modifier on HOST class — dashed green) -->
<rect fill="#0b101a" height="44" rx="6" stroke="#6fd08c" stroke-dasharray="4 3" stroke-width="1.6" width="160" x="40" y="176"></rect>
<text fill="#6fd08c" font-size="11" text-anchor="middle" x="120" y="196">bench CLI</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="120" y="212">on-demand · no ZMQ, no broker</text>
<line marker-end="url(#arr_on)" stroke="#6fd08c" stroke-dasharray="4 3" stroke-width="1.6" x1="200" x2="260" y1="198" y2="160"></line>
<text fill="#6fd08c" font-size="9" x="232" y="190">reuses</text>
<!-- Both timing sources merge into STREAM (stdout) -->
<line marker-end="url(#arr_grey)" stroke="#9aa7bd" stroke-width="1.4" x1="500" x2="560" y1="82" y2="100"></line>
<line marker-end="url(#arr_grey)" stroke="#9aa7bd" stroke-width="1.4" x1="500" x2="560" y1="140" y2="120"></line>
<!-- STREAM class: amber rect (shared sink) -->
<rect fill="#0b101a" height="64" rx="6" stroke="#ffb454" stroke-width="1.6" width="160" x="560" y="80"></rect>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="640" y="100">stdout</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="640" y="116">event=cpu_stage_timings</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="640" y="128">event=gpu_timings · heartbeat</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="640" y="140">event=stats · stop · fatal</text>
<!-- stdout → sink: log capture by harness -->
<line marker-end="url(#arr_grey)" stroke="#9aa7bd" stroke-width="1.4" x1="720" x2="800" y1="112" y2="112"></line>
<!-- HOST class: results dir (host-side filesystem) -->
<rect fill="#13391f" height="64" rx="6" stroke="#6fd08c" stroke-width="1.6" width="160" x="800" y="80"></rect>
<text fill="#6fd08c" font-size="11" text-anchor="middle" x="880" y="100">results/reports/</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="880" y="116">CSV + JSON aggregates</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="880" y="128">scripts/remote/perf-*.sh</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="880" y="140">populates §20 + Diagram W</text>
<!-- Legend (bottom) -->
<g font-size="10">
<line stroke="#6fd08c" stroke-width="1.6" x1="60" x2="84" y1="252" y2="252"></line>
<text fill="#9aa7bd" x="92" y="256">always-on (broker per-serve + 1 Hz heartbeat)</text>
<line stroke="#6fd08c" stroke-dasharray="4 3" stroke-width="1.6" x1="480" x2="504" y1="252" y2="252"></line>
<text fill="#9aa7bd" x="512" y="256">on-demand fallback (bench CLI · §2.1 modifier)</text>
</g>
<defs>
<marker id="arr_on_b" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#5db1ff"></path></marker>
<marker id="arr_grey" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7bd"></path></marker>
</defs>
</svg>

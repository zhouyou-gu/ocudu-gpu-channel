<svg font-family="SF Mono,Menlo,monospace" font-size="11" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
<text fill="#cdd6e6" font-size="12" text-anchor="middle" x="500" y="22">Diagram MF · one destination node's serve, left → right</text>
<defs>
<marker id="arwmf" markerheight="6" markerwidth="6" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#9aa7bd"></path>
</marker>
</defs>
<!-- Lane labels -->
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="60" y="76">ZMQ</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="60" y="125">HOST CPU</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="60" y="174">GPU</text>
<line stroke="#2c3850" x1="100" x2="100" y1="62" y2="190"></line>
<!-- 1: REQ -->
<rect fill="#181f2e" height="34" rx="4" stroke="#cdd6e6" width="120" x="110" y="55"></rect>
<text fill="#cdd6e6" font-size="11" text-anchor="middle" x="170" y="76">1 · REQ in</text>
<!-- 2: align+read+pack -->
<line stroke="#9aa7bd" x1="230" x2="240" y1="72" y2="72"></line>
<line stroke="#9aa7bd" x1="240" x2="240" y1="72" y2="122"></line>
<line marker-end="url(#arwmf)" stroke="#9aa7bd" x1="240" x2="250" y1="122" y2="122"></line>
<rect fill="#0b101a" height="34" rx="4" stroke="#6fd08c" width="160" x="250" y="105"></rect>
<text fill="#6fd08c" font-size="11" text-anchor="middle" x="330" y="126">2 · align + read + pack</text>
<!-- 3: H2D -->
<line stroke="#9aa7bd" x1="410" x2="430" y1="122" y2="122"></line>
<line stroke="#5db1ff" x1="430" x2="430" y1="122" y2="160"></line>
<line marker-end="url(#arwmf)" stroke="#5db1ff" x1="430" x2="450" y1="160" y2="160"></line>
<text fill="#5db1ff" font-size="9" text-anchor="middle" x="445" y="146">H2D</text>
<!-- 4: GPU pipeline -->
<rect fill="#0b101a" height="34" rx="4" stroke="#5db1ff" width="220" x="450" y="155"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="560" y="176">3 · channel · superpose · rx</text>
<!-- 5: D2H -->
<line stroke="#9aa7bd" x1="670" x2="690" y1="170" y2="170"></line>
<line stroke="#5db1ff" x1="690" x2="690" y1="170" y2="132"></line>
<line marker-end="url(#arwmf)" stroke="#5db1ff" x1="690" x2="710" y1="132" y2="132"></line>
<text fill="#5db1ff" font-size="9" text-anchor="middle" x="705" y="148">D2H</text>
<!-- 6: throttle + REP send -->
<rect fill="#0b101a" height="34" rx="4" stroke="#6fd08c" width="160" x="710" y="105"></rect>
<text fill="#6fd08c" font-size="11" text-anchor="middle" x="790" y="126">4 · throttle + advance</text>
<line stroke="#9aa7bd" x1="870" x2="890" y1="122" y2="122"></line>
<line stroke="#9aa7bd" x1="890" x2="890" y1="122" y2="72"></line>
<line marker-end="url(#arwmf)" stroke="#9aa7bd" x1="890" x2="910" y1="72" y2="72"></line>
<rect fill="#181f2e" height="34" rx="4" stroke="#cdd6e6" width="80" x="910" y="55"></rect>
<text fill="#cdd6e6" font-size="11" text-anchor="middle" x="950" y="76">5 · REP out</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 220" font-family="SF Mono,Menlo,monospace" font-size="11">
    <text x="500" y="22" fill="#cdd6e6" text-anchor="middle" font-size="12">Diagram MF · one destination node's serve, left → right</text>

    <defs>
      <marker id="arwmf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#9aa7bd"/>
      </marker>
    </defs>

    <!-- Lane labels -->
    <text x="60"  y="76"  fill="#9aa7bd" font-size="9" text-anchor="middle">ZMQ</text>
    <text x="60"  y="125" fill="#9aa7bd" font-size="9" text-anchor="middle">HOST CPU</text>
    <text x="60"  y="174" fill="#9aa7bd" font-size="9" text-anchor="middle">GPU</text>

    <line x1="100" y1="62" x2="100" y2="190" stroke="#2c3850"/>

    <!-- 1: REQ -->
    <rect x="110" y="55"  width="120" height="34" rx="4" fill="#181f2e" stroke="#cdd6e6"/>
    <text x="170" y="76" fill="#cdd6e6" text-anchor="middle" font-size="11">1 · REQ in</text>

    <!-- 2: align+read+pack -->
    <line x1="230" y1="72"  x2="240" y2="72"  stroke="#9aa7bd"/>
    <line x1="240" y1="72"  x2="240" y2="122" stroke="#9aa7bd"/>
    <line x1="240" y1="122" x2="250" y2="122" stroke="#9aa7bd" marker-end="url(#arwmf)"/>
    <rect x="250" y="105" width="160" height="34" rx="4" fill="#0b101a" stroke="#6fd08c"/>
    <text x="330" y="126" fill="#6fd08c" text-anchor="middle" font-size="11">2 · align + read + pack</text>

    <!-- 3: H2D -->
    <line x1="410" y1="122" x2="430" y2="122" stroke="#9aa7bd"/>
    <line x1="430" y1="122" x2="430" y2="160" stroke="#5db1ff"/>
    <line x1="430" y1="160" x2="450" y2="160" stroke="#5db1ff" marker-end="url(#arwmf)"/>
    <text x="445" y="146" fill="#5db1ff" font-size="9" text-anchor="middle">H2D</text>

    <!-- 4: GPU pipeline -->
    <rect x="450" y="155" width="220" height="34" rx="4" fill="#0b101a" stroke="#5db1ff"/>
    <text x="560" y="176" fill="#5db1ff" text-anchor="middle" font-size="11">3 · channel · superpose · rx</text>

    <!-- 5: D2H -->
    <line x1="670" y1="170" x2="690" y2="170" stroke="#9aa7bd"/>
    <line x1="690" y1="170" x2="690" y2="132" stroke="#5db1ff"/>
    <line x1="690" y1="132" x2="710" y2="132" stroke="#5db1ff" marker-end="url(#arwmf)"/>
    <text x="705" y="148" fill="#5db1ff" font-size="9" text-anchor="middle">D2H</text>

    <!-- 6: throttle + REP send -->
    <rect x="710" y="105" width="160" height="34" rx="4" fill="#0b101a" stroke="#6fd08c"/>
    <text x="790" y="126" fill="#6fd08c" text-anchor="middle" font-size="11">4 · throttle + advance</text>

    <line x1="870" y1="122" x2="890" y2="122" stroke="#9aa7bd"/>
    <line x1="890" y1="122" x2="890" y2="72" stroke="#9aa7bd"/>
    <line x1="890" y1="72"  x2="910" y2="72" stroke="#9aa7bd" marker-end="url(#arwmf)"/>

    <rect x="910" y="55" width="80" height="34" rx="4" fill="#181f2e" stroke="#cdd6e6"/>
    <text x="950" y="76" fill="#cdd6e6" text-anchor="middle" font-size="11">5 · REP out</text>
  </svg>

<svg font-family="SF Mono,Menlo,monospace" font-size="12" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg">
<text fill="#9aa7bd" text-anchor="middle" x="500" y="22">Per-edge leading tdl step shifts each source's contribution at the receiver</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="500" y="36">d_k encodes both physical propagation distance AND constant TX timing offset — composed into one per-edge knob</text>
<!-- virtual time idx ruler -->
<text fill="#9aa7bd" font-size="11" x="20" y="60">virtual time idx</text>
<g fill="#cdd6e6" font-size="11" text-anchor="middle">
<text x="170" y="60">0</text>
<text x="230" y="60">1</text>
<text x="290" y="60">2</text>
<text x="350" y="60">3</text>
<text x="410" y="60">4</text>
<text x="470" y="60">5</text>
<text x="530" y="60">6</text>
<text fill="#ffb454" font-weight="bold" x="590" y="60">7</text>
<text x="650" y="60">8</text>
<text x="710" y="60">9</text>
</g>
<!-- src 0 row -->
<text fill="#6fd08c" font-size="11" x="20" y="94">src 0</text>
<g stroke="#2c3850">
<rect fill="#0b101a" height="28" stroke-dasharray="3 2" width="60" x="140" y="76"></rect>
<rect fill="#0b101a" height="28" stroke-dasharray="3 2" width="60" x="200" y="76"></rect>
<rect fill="#1a2233" height="28" width="60" x="260" y="76"></rect>
<rect fill="#1a2233" height="28" width="60" x="320" y="76"></rect>
<rect fill="#1a2233" height="28" width="60" x="380" y="76"></rect>
<rect fill="#1a2233" height="28" width="60" x="440" y="76"></rect>
<rect fill="#1a2233" height="28" width="60" x="500" y="76"></rect>
<rect fill="#2a2113" height="28" stroke="#ffb454" width="60" x="560" y="76"></rect>
<rect fill="#1a2233" height="28" width="60" x="620" y="76"></rect>
<rect fill="#1a2233" height="28" width="60" x="680" y="76"></rect>
</g>
<g fill="#6fd08c" font-size="11" text-anchor="middle">
<text fill="#9aa7bd" font-size="10" x="170" y="94">⋯</text>
<text fill="#9aa7bd" font-size="10" x="230" y="94">⋯</text>
<text x="290" y="94">a₀</text>
<text x="350" y="94">a₁</text>
<text x="410" y="94">a₂</text>
<text x="470" y="94">a₃</text>
<text x="530" y="94">a₄</text>
<text fill="#ffb454" font-weight="bold" x="590" y="94">a₅</text>
<text x="650" y="94">a₆</text>
<text x="710" y="94">a₇</text>
</g>
<!-- src 0 d_k bracket below dashed cells (x=140 to 260) -->
<g fill="none" stroke="#ffb454" stroke-width="1.5">
<line x1="140" x2="260" y1="110" y2="110"></line>
<line x1="140" x2="140" y1="110" y2="116"></line>
<line x1="260" x2="260" y1="110" y2="116"></line>
</g>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="200" y="128">d_0 = 2 samples (delay_line tail)</text>
<!-- src 1 row -->
<text fill="#6fd08c" font-size="11" x="20" y="166">src 1</text>
<g stroke="#2c3850">
<rect fill="#0b101a" height="28" stroke-dasharray="3 2" width="60" x="140" y="148"></rect>
<rect fill="#0b101a" height="28" stroke-dasharray="3 2" width="60" x="200" y="148"></rect>
<rect fill="#0b101a" height="28" stroke-dasharray="3 2" width="60" x="260" y="148"></rect>
<rect fill="#0b101a" height="28" stroke-dasharray="3 2" width="60" x="320" y="148"></rect>
<rect fill="#0b101a" height="28" stroke-dasharray="3 2" width="60" x="380" y="148"></rect>
<rect fill="#1a2233" height="28" width="60" x="440" y="148"></rect>
<rect fill="#1a2233" height="28" width="60" x="500" y="148"></rect>
<rect fill="#2a2113" height="28" stroke="#ffb454" width="60" x="560" y="148"></rect>
<rect fill="#1a2233" height="28" width="60" x="620" y="148"></rect>
<rect fill="#1a2233" height="28" width="60" x="680" y="148"></rect>
</g>
<g fill="#6fd08c" font-size="11" text-anchor="middle">
<text fill="#9aa7bd" font-size="10" x="170" y="166">⋯</text>
<text fill="#9aa7bd" font-size="10" x="230" y="166">⋯</text>
<text fill="#9aa7bd" font-size="10" x="290" y="166">⋯</text>
<text fill="#9aa7bd" font-size="10" x="350" y="166">⋯</text>
<text fill="#9aa7bd" font-size="10" x="410" y="166">⋯</text>
<text x="470" y="166">b₀</text>
<text x="530" y="166">b₁</text>
<text fill="#ffb454" font-weight="bold" x="590" y="166">b₂</text>
<text x="650" y="166">b₃</text>
<text x="710" y="166">b₄</text>
</g>
<!-- src 1 d_k bracket below dashed cells (x=140 to 440) -->
<g fill="none" stroke="#ffb454" stroke-width="1.5">
<line x1="140" x2="440" y1="182" y2="182"></line>
<line x1="140" x2="140" y1="182" y2="188"></line>
<line x1="440" x2="440" y1="182" y2="188"></line>
</g>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="290" y="200">d_1 = 5 samples (delay_line tail)</text>
<!-- Highlight column at idx=7 (across both source rows) -->
<rect fill="none" height="108" stroke="#ffb454" stroke-dasharray="4 2" stroke-width="1.5" width="64" x="558" y="72"></rect>
<!-- Formula box on right of highlight -->
<line stroke="#ffb454" stroke-dasharray="2 2" x1="624" x2="770" y1="126" y2="126"></line>
<rect fill="#0b101a" height="80" rx="6" stroke="#ffb454" width="220" x="770" y="86"></rect>
<text fill="#ffb454" text-anchor="middle" x="880" y="106">at idx = 7</text>
<text fill="#cdd6e6" font-size="11" text-anchor="middle" x="880" y="126">dst[7] = a₅ + b₂</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="880" y="144">src 0 sample (7−d_0) = 5</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="880" y="158">src 1 sample (7−d_1) = 2</text>
<!-- Annotation lines: where d_k comes from -->
<text fill="#ffb454" font-size="12" x="20" y="230">Where d_k comes from (summed per edge):</text>
<text fill="#cdd6e6" font-size="11" x="40" y="252">·  <tspan fill="#ffb454">propagation delay</tspan>  —  per-edge geometry, YAML: propagation_delay_samples on the edge</text>
<text fill="#cdd6e6" font-size="11" x="40" y="270">·  <tspan fill="#ffb454">tx timing offset</tspan>  —  per-device constant lag, YAML: tx_timing_offset_samples on the device</text>
<text fill="#cdd6e6" font-size="11" x="40" y="288">·  <tspan fill="#9aa7bd">explicit chain step</tspan>  —  tdl as the chain's first step (single-tap with delay_samples = d_k; see §5)</text>
<text fill="#9aa7bd" font-size="10" x="20" y="316">Dashed cells = the delay_line tail kept on the host across slot boundaries so even the earliest idx in a slot has a defined delayed lookup.</text>
</svg>

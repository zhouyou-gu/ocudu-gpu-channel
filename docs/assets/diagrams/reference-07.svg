<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 330" font-family="SF Mono,Menlo,monospace" font-size="12">
    <text x="500" y="22" fill="#9aa7bd" text-anchor="middle">Per-edge leading tdl step shifts each source's contribution at the receiver</text>
    <text x="500" y="36" fill="#9aa7bd" text-anchor="middle" font-size="10">d_k encodes both physical propagation distance AND constant TX timing offset — composed into one per-edge knob</text>

    <!-- virtual time idx ruler -->
    <text x="20" y="60" fill="#9aa7bd" font-size="11">virtual time idx</text>
    <g fill="#cdd6e6" text-anchor="middle" font-size="11">
      <text x="170" y="60">0</text>
      <text x="230" y="60">1</text>
      <text x="290" y="60">2</text>
      <text x="350" y="60">3</text>
      <text x="410" y="60">4</text>
      <text x="470" y="60">5</text>
      <text x="530" y="60">6</text>
      <text x="590" y="60" fill="#ffb454" font-weight="bold">7</text>
      <text x="650" y="60">8</text>
      <text x="710" y="60">9</text>
    </g>

    <!-- src 0 row -->
    <text x="20" y="94" fill="#6fd08c" font-size="11">src 0</text>
    <g stroke="#2c3850">
      <rect x="140" y="76" width="60" height="28" fill="#0b101a" stroke-dasharray="3 2"/>
      <rect x="200" y="76" width="60" height="28" fill="#0b101a" stroke-dasharray="3 2"/>
      <rect x="260" y="76" width="60" height="28" fill="#1a2233"/>
      <rect x="320" y="76" width="60" height="28" fill="#1a2233"/>
      <rect x="380" y="76" width="60" height="28" fill="#1a2233"/>
      <rect x="440" y="76" width="60" height="28" fill="#1a2233"/>
      <rect x="500" y="76" width="60" height="28" fill="#1a2233"/>
      <rect x="560" y="76" width="60" height="28" fill="#2a2113" stroke="#ffb454"/>
      <rect x="620" y="76" width="60" height="28" fill="#1a2233"/>
      <rect x="680" y="76" width="60" height="28" fill="#1a2233"/>
    </g>
    <g fill="#6fd08c" text-anchor="middle" font-size="11">
      <text x="170" y="94" fill="#9aa7bd" font-size="10">⋯</text>
      <text x="230" y="94" fill="#9aa7bd" font-size="10">⋯</text>
      <text x="290" y="94">a₀</text>
      <text x="350" y="94">a₁</text>
      <text x="410" y="94">a₂</text>
      <text x="470" y="94">a₃</text>
      <text x="530" y="94">a₄</text>
      <text x="590" y="94" fill="#ffb454" font-weight="bold">a₅</text>
      <text x="650" y="94">a₆</text>
      <text x="710" y="94">a₇</text>
    </g>

    <!-- src 0 d_k bracket below dashed cells (x=140 to 260) -->
    <g stroke="#ffb454" stroke-width="1.5" fill="none">
      <line x1="140" y1="110" x2="260" y2="110"/>
      <line x1="140" y1="110" x2="140" y2="116"/>
      <line x1="260" y1="110" x2="260" y2="116"/>
    </g>
    <text x="200" y="128" fill="#ffb454" text-anchor="middle" font-size="11">d_0 = 2 samples (delay_line tail)</text>

    <!-- src 1 row -->
    <text x="20" y="166" fill="#6fd08c" font-size="11">src 1</text>
    <g stroke="#2c3850">
      <rect x="140" y="148" width="60" height="28" fill="#0b101a" stroke-dasharray="3 2"/>
      <rect x="200" y="148" width="60" height="28" fill="#0b101a" stroke-dasharray="3 2"/>
      <rect x="260" y="148" width="60" height="28" fill="#0b101a" stroke-dasharray="3 2"/>
      <rect x="320" y="148" width="60" height="28" fill="#0b101a" stroke-dasharray="3 2"/>
      <rect x="380" y="148" width="60" height="28" fill="#0b101a" stroke-dasharray="3 2"/>
      <rect x="440" y="148" width="60" height="28" fill="#1a2233"/>
      <rect x="500" y="148" width="60" height="28" fill="#1a2233"/>
      <rect x="560" y="148" width="60" height="28" fill="#2a2113" stroke="#ffb454"/>
      <rect x="620" y="148" width="60" height="28" fill="#1a2233"/>
      <rect x="680" y="148" width="60" height="28" fill="#1a2233"/>
    </g>
    <g fill="#6fd08c" text-anchor="middle" font-size="11">
      <text x="170" y="166" fill="#9aa7bd" font-size="10">⋯</text>
      <text x="230" y="166" fill="#9aa7bd" font-size="10">⋯</text>
      <text x="290" y="166" fill="#9aa7bd" font-size="10">⋯</text>
      <text x="350" y="166" fill="#9aa7bd" font-size="10">⋯</text>
      <text x="410" y="166" fill="#9aa7bd" font-size="10">⋯</text>
      <text x="470" y="166">b₀</text>
      <text x="530" y="166">b₁</text>
      <text x="590" y="166" fill="#ffb454" font-weight="bold">b₂</text>
      <text x="650" y="166">b₃</text>
      <text x="710" y="166">b₄</text>
    </g>

    <!-- src 1 d_k bracket below dashed cells (x=140 to 440) -->
    <g stroke="#ffb454" stroke-width="1.5" fill="none">
      <line x1="140" y1="182" x2="440" y2="182"/>
      <line x1="140" y1="182" x2="140" y2="188"/>
      <line x1="440" y1="182" x2="440" y2="188"/>
    </g>
    <text x="290" y="200" fill="#ffb454" text-anchor="middle" font-size="11">d_1 = 5 samples (delay_line tail)</text>

    <!-- Highlight column at idx=7 (across both source rows) -->
    <rect x="558" y="72" width="64" height="108" fill="none" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Formula box on right of highlight -->
    <line x1="624" y1="126" x2="770" y2="126" stroke="#ffb454" stroke-dasharray="2 2"/>
    <rect x="770" y="86" width="220" height="80" rx="6" fill="#0b101a" stroke="#ffb454"/>
    <text x="880" y="106" fill="#ffb454" text-anchor="middle">at idx = 7</text>
    <text x="880" y="126" fill="#cdd6e6" text-anchor="middle" font-size="11">dst[7] = a₅ + b₂</text>
    <text x="880" y="144" fill="#9aa7bd" text-anchor="middle" font-size="10">src 0 sample (7−d_0) = 5</text>
    <text x="880" y="158" fill="#9aa7bd" text-anchor="middle" font-size="10">src 1 sample (7−d_1) = 2</text>

    <!-- Annotation lines: where d_k comes from -->
    <text x="20" y="230" fill="#ffb454" font-size="12">Where d_k comes from (summed per edge):</text>
    <text x="40" y="252" fill="#cdd6e6" font-size="11">·  <tspan fill="#ffb454">propagation delay</tspan>  —  per-edge geometry, YAML: propagation_delay_samples on the edge</text>
    <text x="40" y="270" fill="#cdd6e6" font-size="11">·  <tspan fill="#ffb454">tx timing offset</tspan>  —  per-device constant lag, YAML: tx_timing_offset_samples on the device</text>
    <text x="40" y="288" fill="#cdd6e6" font-size="11">·  <tspan fill="#9aa7bd">explicit chain step</tspan>  —  tdl as the chain's first step (single-tap with delay_samples = d_k; see §5)</text>
    <text x="20" y="316" fill="#9aa7bd" font-size="10">Dashed cells = the delay_line tail kept on the host across slot boundaries so even the earliest idx in a slot has a defined delayed lookup.</text>
  </svg>

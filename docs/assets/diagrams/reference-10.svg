<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 200" font-family="SF Mono,Menlo,monospace" font-size="11">
    <text x="500" y="20" fill="#cdd6e6" text-anchor="middle" font-size="12">Diagram X · DeviceLinkState · built once, mostly read-only, two fields mutate per slot</text>

    <defs>
      <marker id="arxn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#9aa7bd"/>
      </marker>
    </defs>

    <!-- prepare() box -->
    <rect x="40" y="50" width="240" height="100" rx="6" fill="#13391f" stroke="#6fd08c"/>
    <text x="160" y="74" fill="#6fd08c" text-anchor="middle" font-size="11">prepare() · ONCE</text>
    <text x="160" y="98" fill="#cdd6e6" text-anchor="middle" font-size="10">YAML → DeviceLinkState[]</text>
    <text x="160" y="116" fill="#cdd6e6" text-anchor="middle" font-size="10">cudaMemcpy H2D</text>
    <text x="160" y="138" fill="#9aa7bd" text-anchor="middle" font-size="9">~10 KB per edge</text>

    <line x1="280" y1="100" x2="320" y2="100" stroke="#9aa7bd" marker-end="url(#arxn)"/>

    <!-- Kernel reads -->
    <rect x="320" y="50" width="320" height="100" rx="6" fill="#0b101a" stroke="#5db1ff"/>
    <text x="480" y="74" fill="#5db1ff" text-anchor="middle" font-size="11">apply_channel_kernel · READ ONLY</text>
    <text x="480" y="92" fill="#cdd6e6" text-anchor="middle" font-size="10">tap_* · fading_* · polyphase · alpha · phi</text>
    <text x="480" y="106" fill="#cdd6e6" text-anchor="middle" font-size="10">los_* · src_index</text>
    <text x="480" y="124" fill="#9aa7bd" text-anchor="middle" font-size="9">never mutated after prepare</text>
    <text x="480" y="140" fill="#9aa7bd" text-anchor="middle" font-size="9">→ writes device_staged only</text>

    <line x1="640" y1="100" x2="680" y2="100" stroke="#5db1ff" marker-end="url(#arxn)"/>

    <!-- Kernel mutates (writes) — DEVICE class, "MUTATES" annotated via text only -->
    <rect x="680" y="50" width="280" height="100" rx="6" fill="#0b101a" stroke="#5db1ff" stroke-width="1.6"/>
    <text x="820" y="74" fill="#5db1ff" text-anchor="middle" font-size="11">update_delay_line</text>
    <text x="820" y="90" fill="#9aa7bd" text-anchor="middle" font-size="9">writes back the only two mutable fields</text>
    <text x="820" y="108" fill="#cdd6e6" text-anchor="middle" font-size="10">delay_line[] · slot_start_samples</text>
    <text x="820" y="128" fill="#9aa7bd" text-anchor="middle" font-size="9">read again next slot</text>

    <!-- Loop arrow -->
    <line x1="820" y1="150" x2="820" y2="180" stroke="#9aa7bd"/>
    <line x1="820" y1="180" x2="480" y2="180" stroke="#9aa7bd"/>
    <line x1="480" y1="180" x2="480" y2="150" stroke="#9aa7bd" marker-end="url(#arxn)"/>
    <text x="650" y="194" fill="#9aa7bd" font-size="9" text-anchor="middle">next slot</text>
  </svg>

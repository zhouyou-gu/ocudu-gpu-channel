<svg font-family="SF Mono,Menlo,monospace" font-size="11" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
<text fill="#cdd6e6" font-size="12" text-anchor="middle" x="500" y="20">Diagram X · DeviceLinkState · built once, mostly read-only, two fields mutate per slot</text>
<defs>
<marker id="arxn" markerheight="6" markerwidth="6" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M0,0 L10,5 L0,10 z" fill="#9aa7bd"></path>
</marker>
</defs>
<!-- prepare() box -->
<rect fill="#13391f" height="100" rx="6" stroke="#6fd08c" width="240" x="40" y="50"></rect>
<text fill="#6fd08c" font-size="11" text-anchor="middle" x="160" y="74">prepare() · ONCE</text>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="160" y="98">YAML → DeviceLinkState[]</text>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="160" y="116">cudaMemcpy H2D</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="160" y="138">~10 KB per edge</text>
<line marker-end="url(#arxn)" stroke="#9aa7bd" x1="280" x2="320" y1="100" y2="100"></line>
<!-- Kernel reads -->
<rect fill="#0b101a" height="100" rx="6" stroke="#5db1ff" width="320" x="320" y="50"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="480" y="74">apply_channel_kernel · READ ONLY</text>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="480" y="92">tap_* · fading_* · polyphase · alpha · phi</text>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="480" y="106">los_* · src_index</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="480" y="124">never mutated after prepare</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="480" y="140">→ writes device_staged only</text>
<line marker-end="url(#arxn)" stroke="#5db1ff" x1="640" x2="680" y1="100" y2="100"></line>
<!-- Kernel mutates (writes) — DEVICE class, "MUTATES" annotated via text only -->
<rect fill="#0b101a" height="100" rx="6" stroke="#5db1ff" stroke-width="1.6" width="280" x="680" y="50"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="820" y="74">update_delay_line</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="820" y="90">writes back the only two mutable fields</text>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="820" y="108">delay_line[] · slot_start_samples</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="820" y="128">read again next slot</text>
<!-- Loop arrow -->
<line stroke="#9aa7bd" x1="820" x2="820" y1="150" y2="180"></line>
<line stroke="#9aa7bd" x1="820" x2="480" y1="180" y2="180"></line>
<line marker-end="url(#arxn)" stroke="#9aa7bd" x1="480" x2="480" y1="180" y2="150"></line>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="650" y="194">next slot</text>
</svg>

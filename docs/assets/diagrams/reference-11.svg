<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 380" font-family="SF Mono,Menlo,monospace" font-size="11">
    <text x="500" y="20" fill="#cdd6e6" text-anchor="middle" font-size="12">Diagram Y · 8-tap polyphase windowed-sinc · per-sample read geometry · tau = tau_int + frac (frac in [0,1))</text>

    <!-- Number line: sample indices · time runs left → right · past on left, future on right -->
    <line x1="60" y1="120" x2="940" y2="120" stroke="#9aa7bd"/>
    <text x="60"  y="155" fill="#9aa7bd" font-size="9">← past</text>
    <text x="940" y="155" fill="#9aa7bd" font-size="9" text-anchor="end">future →</text>
    <g fill="#9aa7bd" font-size="9" text-anchor="middle">
      <line x1="100" y1="115" x2="100" y2="125" stroke="#9aa7bd"/>
      <text x="100" y="140">idx−τ_int−4</text>
      <line x1="200" y1="115" x2="200" y2="125" stroke="#9aa7bd"/>
      <text x="200" y="140">−3</text>
      <line x1="300" y1="115" x2="300" y2="125" stroke="#9aa7bd"/>
      <text x="300" y="140">−2</text>
      <line x1="400" y1="115" x2="400" y2="125" stroke="#9aa7bd"/>
      <text x="400" y="140">−1</text>
      <line x1="500" y1="115" x2="500" y2="125" stroke="#9aa7bd"/>
      <text x="500" y="140">idx−τ_int  (i=3, peak)</text>
      <line x1="600" y1="115" x2="600" y2="125" stroke="#9aa7bd"/>
      <text x="600" y="140">+1</text>
      <line x1="700" y1="115" x2="700" y2="125" stroke="#9aa7bd"/>
      <text x="700" y="140">+2</text>
      <line x1="800" y1="115" x2="800" y2="125" stroke="#9aa7bd"/>
      <text x="800" y="140">+3</text>
    </g>

    <!-- Read window markers (8 samples). read_idx = idx − τ_int + 3 − i:
         i=7 → read_idx = idx − τ_int − 4 (past, LEFT)
         i=3 → read_idx = idx − τ_int       (center)
         i=0 → read_idx = idx − τ_int + 3 (future, RIGHT) -->
    <g>
      <rect x="80"  y="90" width="40" height="30" fill="rgba(93,177,255,0.30)" stroke="#5db1ff"/>
      <text x="100" y="108" fill="#5db1ff" text-anchor="middle" font-size="9">h[7]</text>
      <rect x="180" y="80" width="40" height="40" fill="rgba(93,177,255,0.40)" stroke="#5db1ff"/>
      <text x="200" y="103" fill="#5db1ff" text-anchor="middle" font-size="9">h[6]</text>
      <rect x="280" y="65" width="40" height="55" fill="rgba(93,177,255,0.55)" stroke="#5db1ff"/>
      <text x="300" y="93"  fill="#5db1ff" text-anchor="middle" font-size="9">h[5]</text>
      <rect x="380" y="50" width="40" height="70" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="400" y="78" fill="#6fd08c" text-anchor="middle" font-size="9">h[4]</text>
      <rect x="480" y="50" width="40" height="70" fill="rgba(93,177,255,0.45)" stroke="#5db1ff"/>
      <text x="500" y="78" fill="#6fd08c" text-anchor="middle" font-size="9">h[3]</text>
      <rect x="580" y="65" width="40" height="55" fill="rgba(93,177,255,0.55)" stroke="#5db1ff"/>
      <text x="600" y="93"  fill="#5db1ff" text-anchor="middle" font-size="9">h[2]</text>
      <rect x="680" y="80" width="40" height="40" fill="rgba(93,177,255,0.40)" stroke="#5db1ff"/>
      <text x="700" y="103" fill="#5db1ff" text-anchor="middle" font-size="9">h[1]</text>
      <rect x="780" y="90" width="40" height="30" fill="rgba(93,177,255,0.30)" stroke="#5db1ff"/>
      <text x="800" y="108" fill="#5db1ff" text-anchor="middle" font-size="9">h[0]</text>
    </g>

    <!-- Convolution formula -->
    <rect x="60" y="170" width="880" height="50" rx="6" fill="#181f2e" stroke="#cdd6e6"/>
    <text x="500" y="190" fill="#cdd6e6" text-anchor="middle" font-size="11">y[idx] = sum over i in 0..7  of  h[i] · x[idx − τ_int + 3 − i]</text>
    <text x="500" y="208" fill="#9aa7bd" text-anchor="middle" font-size="10">coefficients h[i] depend on frac = τ − floor(τ) via compute_windowed_sinc_taps(); sum_i h[i] = 1 (DC-normalised); h[3] = sinc(frac) · w(0)</text>

    <!-- Boundary read regions -->
    <rect x="60" y="240" width="430" height="120" rx="6" fill="#13391f" stroke="#6fd08c"/>
    <text x="275" y="258" fill="#6fd08c" text-anchor="middle" font-size="11">read_idx in [0, count)</text>
    <text x="275" y="276" fill="#cdd6e6" text-anchor="middle" font-size="10">x[read_idx] from in_buffer[k·count + read_idx]</text>
    <text x="275" y="294" fill="#cdd6e6" text-anchor="middle" font-size="10">(this slot's raw IQ — the normal case)</text>
    <text x="275" y="320" fill="#cdd6e6" text-anchor="middle" font-size="10">read_idx in [−dl_size, 0)</text>
    <text x="275" y="338" fill="#cdd6e6" text-anchor="middle" font-size="10">x[read_idx] from delay_line[dl_size + read_idx]</text>
    <text x="275" y="354" fill="#9aa7bd" text-anchor="middle" font-size="9">(previous slot's tail — cross-slot continuity, Diagram Z)</text>

    <rect x="510" y="240" width="430" height="120" rx="6" fill="rgba(255,180,84,0.10)" stroke="#ffb454"/>
    <text x="725" y="258" fill="#ffb454" text-anchor="middle" font-size="11">read_idx ≥ count</text>
    <text x="725" y="276" fill="#cdd6e6" text-anchor="middle" font-size="10">x = 0  (zero-padding into future)</text>
    <text x="725" y="294" fill="#cdd6e6" text-anchor="middle" font-size="10">edge effect: filter spans up to idx + 3</text>
    <text x="725" y="320" fill="#ffb454" text-anchor="middle" font-size="11">read_idx &lt; −dl_size</text>
    <text x="725" y="338" fill="#cdd6e6" text-anchor="middle" font-size="10">x = 0  (zero-padding before history)</text>
    <text x="725" y="354" fill="#9aa7bd" text-anchor="middle" font-size="9">only triggers on the very first slot</text>
  </svg>

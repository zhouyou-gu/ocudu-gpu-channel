<svg font-family="SF Mono,Menlo,monospace" font-size="11" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ars" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5">
<path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7bd"></path>
</marker>
</defs>
<text fill="#cdd6e6" font-size="12" text-anchor="middle" x="500" y="20">Diagram S · per-edge channel path · gate decides device-default vs host-fallback, both converge at device_staged</text>
<!-- Dispatch gate at top -->
<polygon fill="#0b101a" points="500,42 700,72 500,102 300,72" stroke="#ffb454" stroke-width="1.6"></polygon>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="500" y="68">sp.use_device_channel</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="500" y="84">(every incoming edge has leading tdl? — §11.1 Diagram SG)</text>
<!-- Branch labels -->
<text fill="#6fd08c" font-size="10" text-anchor="middle" x="180" y="98">true · DEFAULT</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="820" y="98">false · FALLBACK</text>
<!-- Branch arrows from gate -->
<line marker-end="url(#ars)" stroke="#6fd08c" stroke-width="1.6" x1="300" x2="180" y1="72" y2="120"></line>
<line marker-end="url(#ars)" stroke="#9aa7bd" stroke-width="1.6" x1="700" x2="820" y1="72" y2="120"></line>
<!-- ===== LEFT COLUMN: device-default path (Phase 2 D3 + D4) ===== -->
<!-- Lane border uses neutral grey since it groups boxes of multiple classes (HOST pack + DEVICE kernel). -->
<rect fill="#0b101a" height="220" rx="8" stroke="#9aa7bd" stroke-width="1.6" width="420" x="40" y="120"></rect>
<text fill="#cdd6e6" font-size="12" text-anchor="middle" x="250" y="142">DEVICE PATH (Phase 2 D3 + D4)</text>
<rect fill="#0b101a" height="40" rx="4" stroke="#6fd08c" width="200" x="60" y="156"></rect>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="160" y="171">host: pack per-SOURCE</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="160" y="186">→ host_source_iq[s·count]</text>
<line marker-end="url(#ars)" stroke="#9aa7bd" x1="260" x2="290" y1="176" y2="176"></line>
<rect fill="#181f2e" height="40" rx="4" stroke="#5db1ff" width="150" x="290" y="156"></rect>
<text fill="#5db1ff" font-size="10" text-anchor="middle" x="365" y="171">H2D</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="365" y="186">→ device_source_iq</text>
<line marker-end="url(#ars)" stroke="#9aa7bd" x1="250" x2="250" y1="200" y2="220"></line>
<rect fill="#0b101a" height="56" rx="4" stroke="#5db1ff" stroke-width="1.6" width="380" x="60" y="222"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="250" y="238">apply_channel_kernel</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="250" y="254">multi-tap polyphase (§11.3 Y) · Jakes + Rician (§6)</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="250" y="268">src_index read (§11.2 X)</text>
<line marker-end="url(#ars)" stroke="#9aa7bd" x1="250" x2="250" y1="278" y2="284"></line>
<rect fill="#0b101a" height="40" rx="4" stroke="#5db1ff" stroke-width="1.6" width="380" x="60" y="286"></rect>
<text fill="#5db1ff" font-size="10" text-anchor="middle" x="250" y="304">update_delay_line_kernel</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="250" y="318">roll delay_line ring · advance slot_start_samples (§11.4 Z)</text>
<!-- ===== RIGHT COLUMN: host-fallback path ===== -->
<rect fill="#181f2e" height="220" rx="8" stroke="#9aa7bd" stroke-dasharray="4 3" stroke-width="1.6" width="420" x="540" y="120"></rect>
<text fill="#9aa7bd" font-size="12" text-anchor="middle" x="750" y="142">HOST FALLBACK (mixed / non-tdl-leading nodes)</text>
<rect fill="#0b101a" height="60" rx="4" stroke="#ffb454" stroke-width="1.6" width="380" x="560" y="156"></rect>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="750" y="174">stage_link → apply_tdl_step{_fading} (delay.h)</text>
<text fill="#cdd6e6" font-size="9" text-anchor="middle" x="750" y="190">runs the channel math on the HOST · per edge</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="750" y="204">writes shaped IQ → host_staged[k·count]</text>
<line marker-end="url(#ars)" stroke="#9aa7bd" x1="750" x2="750" y1="216" y2="234"></line>
<rect fill="#181f2e" height="40" rx="4" stroke="#5db1ff" width="380" x="560" y="236"></rect>
<text fill="#5db1ff" font-size="10" text-anchor="middle" x="750" y="254">H2D (already-shaped IQ)</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="750" y="268">host_staged → device_staged</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="750" y="312">CPU uses the same delay.h helpers → compared at 1e-3 (§14)</text>
<!-- Converge -->
<line marker-end="url(#ars)" stroke="#9aa7bd" stroke-width="1.4" x1="250" x2="500" y1="328" y2="370"></line>
<line marker-end="url(#ars)" stroke="#9aa7bd" stroke-dasharray="4 3" stroke-width="1.4" x1="750" x2="500" y1="278" y2="370"></line>
<rect fill="#181f2e" height="40" rx="4" stroke="#cdd6e6" stroke-width="1.4" width="360" x="320" y="372"></rect>
<text fill="#cdd6e6" font-size="11" text-anchor="middle" x="500" y="390">device_staged · same layout from both paths</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="500" y="404">[N edges × count IqSamples], channel already applied</text>
<line marker-end="url(#ars)" stroke="#9aa7bd" x1="500" x2="500" y1="412" y2="430"></line>
<rect fill="#0b101a" height="40" rx="4" stroke="#5db1ff" stroke-width="1.6" width="760" x="120" y="432"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="500" y="450">superpose_kernel (§12) — per-sample chain (§13) · Σ over edges → device_output</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="500" y="464">tdl step is a no-op here on the device path (already applied above)</text>
</svg>

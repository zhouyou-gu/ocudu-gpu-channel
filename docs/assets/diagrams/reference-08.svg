<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 480" font-family="SF Mono,Menlo,monospace" font-size="11">
    <defs>
      <marker id="ars" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7bd"/>
      </marker>
    </defs>

    <text x="500" y="20" fill="#cdd6e6" text-anchor="middle" font-size="12">Diagram S · per-edge channel path · gate decides device-default vs host-fallback, both converge at device_staged</text>

    <!-- Dispatch gate at top -->
    <polygon points="500,42 700,72 500,102 300,72" fill="#0b101a" stroke="#ffb454" stroke-width="1.6"/>
    <text x="500" y="68" fill="#ffb454" text-anchor="middle" font-size="11">sp.use_device_channel</text>
    <text x="500" y="84" fill="#9aa7bd" text-anchor="middle" font-size="9">(every incoming edge has leading tdl? — §11.1 Diagram SG)</text>

    <!-- Branch labels -->
    <text x="180" y="98" fill="#6fd08c" font-size="10" text-anchor="middle">true · DEFAULT</text>
    <text x="820" y="98" fill="#9aa7bd" font-size="10" text-anchor="middle">false · FALLBACK</text>

    <!-- Branch arrows from gate -->
    <line x1="300" y1="72" x2="180" y2="120" stroke="#6fd08c" stroke-width="1.6" marker-end="url(#ars)"/>
    <line x1="700" y1="72" x2="820" y2="120" stroke="#9aa7bd" stroke-width="1.6" marker-end="url(#ars)"/>

    <!-- ===== LEFT COLUMN: device-default path (Phase 2 D3 + D4) ===== -->
    <!-- Lane border uses neutral grey since it groups boxes of multiple classes (HOST pack + DEVICE kernel). -->
    <rect x="40" y="120" width="420" height="220" rx="8" fill="#0b101a" stroke="#9aa7bd" stroke-width="1.6"/>
    <text x="250" y="142" fill="#cdd6e6" text-anchor="middle" font-size="12">DEVICE PATH (Phase 2 D3 + D4)</text>

    <rect x="60" y="156" width="200" height="40" rx="4" fill="#0b101a" stroke="#6fd08c"/>
    <text x="160" y="171" fill="#cdd6e6" text-anchor="middle" font-size="10">host: pack per-SOURCE</text>
    <text x="160" y="186" fill="#9aa7bd" text-anchor="middle" font-size="9">→ host_source_iq[s·count]</text>

    <line x1="260" y1="176" x2="290" y2="176" stroke="#9aa7bd" marker-end="url(#ars)"/>
    <rect x="290" y="156" width="150" height="40" rx="4" fill="#181f2e" stroke="#5db1ff"/>
    <text x="365" y="171" fill="#5db1ff" text-anchor="middle" font-size="10">H2D</text>
    <text x="365" y="186" fill="#9aa7bd" text-anchor="middle" font-size="9">→ device_source_iq</text>

    <line x1="250" y1="200" x2="250" y2="220" stroke="#9aa7bd" marker-end="url(#ars)"/>

    <rect x="60" y="222" width="380" height="56" rx="4" fill="#0b101a" stroke="#5db1ff" stroke-width="1.6"/>
    <text x="250" y="238" fill="#5db1ff" text-anchor="middle" font-size="11">apply_channel_kernel</text>
    <text x="250" y="254" fill="#cdd6e6" text-anchor="middle" font-size="9">multi-tap polyphase (§11.3 Y) · Jakes + Rician (§6)</text>
    <text x="250" y="268" fill="#cdd6e6" text-anchor="middle" font-size="9">src_index read (§11.2 X)</text>

    <line x1="250" y1="278" x2="250" y2="284" stroke="#9aa7bd" marker-end="url(#ars)"/>

    <rect x="60" y="286" width="380" height="40" rx="4" fill="#0b101a" stroke="#5db1ff" stroke-width="1.6"/>
    <text x="250" y="304" fill="#5db1ff" text-anchor="middle" font-size="10">update_delay_line_kernel</text>
    <text x="250" y="318" fill="#9aa7bd" text-anchor="middle" font-size="9">roll delay_line ring · advance slot_start_samples (§11.4 Z)</text>

    <!-- ===== RIGHT COLUMN: host-fallback path ===== -->
    <rect x="540" y="120" width="420" height="220" rx="8" fill="#181f2e" stroke="#9aa7bd" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="750" y="142" fill="#9aa7bd" text-anchor="middle" font-size="12">HOST FALLBACK (mixed / non-tdl-leading nodes)</text>

    <rect x="560" y="156" width="380" height="60" rx="4" fill="#0b101a" stroke="#ffb454" stroke-width="1.6"/>
    <text x="750" y="174" fill="#ffb454" text-anchor="middle" font-size="11">stage_link → apply_tdl_step{_fading} (delay.h)</text>
    <text x="750" y="190" fill="#cdd6e6" text-anchor="middle" font-size="9">runs the channel math on the HOST · per edge</text>
    <text x="750" y="204" fill="#9aa7bd" text-anchor="middle" font-size="9">writes shaped IQ → host_staged[k·count]</text>

    <line x1="750" y1="216" x2="750" y2="234" stroke="#9aa7bd" marker-end="url(#ars)"/>

    <rect x="560" y="236" width="380" height="40" rx="4" fill="#181f2e" stroke="#5db1ff"/>
    <text x="750" y="254" fill="#5db1ff" text-anchor="middle" font-size="10">H2D (already-shaped IQ)</text>
    <text x="750" y="268" fill="#9aa7bd" text-anchor="middle" font-size="9">host_staged → device_staged</text>

    <text x="750" y="312" fill="#9aa7bd" text-anchor="middle" font-size="9">CPU uses the same delay.h helpers → compared at 1e-3 (§14)</text>

    <!-- Converge -->
    <line x1="250" y1="328" x2="500" y2="370" stroke="#9aa7bd" stroke-width="1.4" marker-end="url(#ars)"/>
    <line x1="750" y1="278" x2="500" y2="370" stroke="#9aa7bd" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ars)"/>

    <rect x="320" y="372" width="360" height="40" rx="4" fill="#181f2e" stroke="#cdd6e6" stroke-width="1.4"/>
    <text x="500" y="390" fill="#cdd6e6" text-anchor="middle" font-size="11">device_staged · same layout from both paths</text>
    <text x="500" y="404" fill="#9aa7bd" text-anchor="middle" font-size="9">[N edges × count IqSamples], channel already applied</text>

    <line x1="500" y1="412" x2="500" y2="430" stroke="#9aa7bd" marker-end="url(#ars)"/>

    <rect x="120" y="432" width="760" height="40" rx="4" fill="#0b101a" stroke="#5db1ff" stroke-width="1.6"/>
    <text x="500" y="450" fill="#5db1ff" text-anchor="middle" font-size="11">superpose_kernel (§12) — per-sample chain (§13) · Σ over edges → device_output</text>
    <text x="500" y="464" fill="#9aa7bd" text-anchor="middle" font-size="9">tdl step is a no-op here on the device path (already applied above)</text>
  </svg>

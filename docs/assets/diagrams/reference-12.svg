<svg font-family="SF Mono,Menlo,monospace" font-size="11" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arz" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5">
<path d="M0,0 L9,4.5 L0,9 z" fill="#ffb454"></path>
</marker>
</defs>
<text fill="#cdd6e6" font-size="12" text-anchor="middle" x="500" y="20">Diagram Z · the ring as the bridge between slots · two slots shown · dl_size = 32, count = 23 040</text>
<!-- Time axis -->
<text fill="#9aa7bd" font-size="9" x="20" y="48">time →</text>
<!-- Slot N-1: in_buffer bar with highlighted tail — DEVICE storage (device_source_iq) -->
<text fill="#9aa7bd" font-size="10" x="20" y="76">Slot N−1</text>
<rect fill="#0b101a" height="34" stroke="#5db1ff" stroke-width="1.4" width="400" x="90" y="60"></rect>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="270" y="80">device_source_iq · slot N−1 window</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="270" y="92">first 23008 samples consumed by kernel reads, then discarded</text>
<!-- Highlighted tail (last 32) — narrow strip on the right -->
<rect fill="rgba(255,180,84,0.55)" height="34" stroke="#ffb454" stroke-width="1.4" width="20" x="470" y="60"></rect>
<text fill="#ffb454" font-size="9" text-anchor="middle" x="480" y="55">tail · 32</text>
<!-- Bridge: tail-of-N-1 → delay_line → history-of-N -->
<path d="M 480 94 Q 480 130 510 130" fill="none" marker-end="url(#arz)" stroke="#ffb454" stroke-width="1.6"></path>
<rect fill="#181f2e" height="34" rx="4" stroke="#ffb454" stroke-width="1.6" width="110" x="510" y="116"></rect>
<text fill="#ffb454" font-size="10" text-anchor="middle" x="565" y="132">delay_line[0..31]</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="565" y="144">kept across slots</text>
<path d="M 620 130 Q 660 130 660 166" fill="none" marker-end="url(#arz)" stroke="#ffb454" stroke-width="1.6"></path>
<!-- Slot N: history slice on the left, then in_buffer bar, with its own tail highlight -->
<text fill="#9aa7bd" font-size="10" x="20" y="186">Slot N</text>
<rect fill="rgba(255,180,84,0.55)" height="34" stroke="#ffb454" stroke-width="1.4" width="20" x="650" y="170"></rect>
<text fill="#ffb454" font-size="9" text-anchor="middle" x="660" y="166">history · 32</text>
<rect fill="#0b101a" height="34" stroke="#5db1ff" stroke-width="1.4" width="280" x="670" y="170"></rect>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="810" y="190">device_source_iq · slot N window</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="810" y="202">kernel reads here for read_idx ≥ 0</text>
<!-- Slot N's own tail (will become slot N+1's ring) -->
<rect fill="rgba(255,180,84,0.55)" height="34" stroke="#ffb454" stroke-width="1.4" width="20" x="930" y="170"></rect>
<text fill="#ffb454" font-size="9" text-anchor="middle" x="940" y="166">tail · 32</text>
<path d="M 940 204 Q 970 220 970 240" fill="none" marker-end="url(#arz)" stroke="#ffb454" stroke-dasharray="3 3" stroke-width="1.6"></path>
<text fill="#9aa7bd" font-size="9" text-anchor="end" x="978" y="220">→ ring for slot N+1</text>
<!-- Read rules + slot_start_samples advance -->
<rect fill="#0b101a" height="70" rx="4" stroke="#5db1ff" stroke-width="1.4" width="960" x="20" y="240"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="500" y="258">apply_channel_kernel read rule for slot N (per output sample, per tap)</text>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="500" y="278">read_idx ∈ [0, count)    → in_buffer[k·count + read_idx]    (this slot)</text>
<text fill="#cdd6e6" font-size="10" text-anchor="middle" x="500" y="292">read_idx ∈ [−dl_size, 0) → delay_line[dl_size + read_idx]   (slot N−1's tail)</text>
<text fill="#9aa7bd" font-size="9" text-anchor="middle" x="500" y="305">read_idx &lt; −dl_size      → 0 (only triggers on the very first slot)        +    slot_start_samples += count (Jakes phase continuity)</text>
</svg>

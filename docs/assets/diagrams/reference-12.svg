<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 320" font-family="SF Mono,Menlo,monospace" font-size="11">
    <defs>
      <marker id="arz" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#ffb454"/>
      </marker>
    </defs>

    <text x="500" y="20" fill="#cdd6e6" text-anchor="middle" font-size="12">Diagram Z · the ring as the bridge between slots · two slots shown · dl_size = 32, count = 23 040</text>

    <!-- Time axis -->
    <text x="20"  y="48" fill="#9aa7bd" font-size="9">time →</text>

    <!-- Slot N-1: in_buffer bar with highlighted tail — DEVICE storage (device_source_iq) -->
    <text x="20" y="76" fill="#9aa7bd" font-size="10">Slot N−1</text>
    <rect x="90" y="60" width="400" height="34" fill="#0b101a" stroke="#5db1ff" stroke-width="1.4"/>
    <text x="270" y="80" fill="#cdd6e6" text-anchor="middle" font-size="10">device_source_iq · slot N−1 window</text>
    <text x="270" y="92" fill="#9aa7bd" text-anchor="middle" font-size="9">first 23008 samples consumed by kernel reads, then discarded</text>

    <!-- Highlighted tail (last 32) — narrow strip on the right -->
    <rect x="470" y="60" width="20" height="34" fill="rgba(255,180,84,0.55)" stroke="#ffb454" stroke-width="1.4"/>
    <text x="480" y="55" fill="#ffb454" text-anchor="middle" font-size="9">tail · 32</text>

    <!-- Bridge: tail-of-N-1 → delay_line → history-of-N -->
    <path d="M 480 94 Q 480 130 510 130" fill="none" stroke="#ffb454" stroke-width="1.6" marker-end="url(#arz)"/>

    <rect x="510" y="116" width="110" height="34" rx="4" fill="#181f2e" stroke="#ffb454" stroke-width="1.6"/>
    <text x="565" y="132" fill="#ffb454" text-anchor="middle" font-size="10">delay_line[0..31]</text>
    <text x="565" y="144" fill="#9aa7bd" text-anchor="middle" font-size="9">kept across slots</text>

    <path d="M 620 130 Q 660 130 660 166" fill="none" stroke="#ffb454" stroke-width="1.6" marker-end="url(#arz)"/>

    <!-- Slot N: history slice on the left, then in_buffer bar, with its own tail highlight -->
    <text x="20" y="186" fill="#9aa7bd" font-size="10">Slot N</text>
    <rect x="650" y="170" width="20" height="34" fill="rgba(255,180,84,0.55)" stroke="#ffb454" stroke-width="1.4"/>
    <text x="660" y="166" fill="#ffb454" text-anchor="middle" font-size="9">history · 32</text>

    <rect x="670" y="170" width="280" height="34" fill="#0b101a" stroke="#5db1ff" stroke-width="1.4"/>
    <text x="810" y="190" fill="#cdd6e6" text-anchor="middle" font-size="10">device_source_iq · slot N window</text>
    <text x="810" y="202" fill="#9aa7bd" text-anchor="middle" font-size="9">kernel reads here for read_idx ≥ 0</text>

    <!-- Slot N's own tail (will become slot N+1's ring) -->
    <rect x="930" y="170" width="20" height="34" fill="rgba(255,180,84,0.55)" stroke="#ffb454" stroke-width="1.4"/>
    <text x="940" y="166" fill="#ffb454" text-anchor="middle" font-size="9">tail · 32</text>
    <path d="M 940 204 Q 970 220 970 240" fill="none" stroke="#ffb454" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arz)"/>
    <text x="978" y="220" fill="#9aa7bd" font-size="9" text-anchor="end">→ ring for slot N+1</text>

    <!-- Read rules + slot_start_samples advance -->
    <rect x="20" y="240" width="960" height="70" rx="4" fill="#0b101a" stroke="#5db1ff" stroke-width="1.4"/>
    <text x="500" y="258" fill="#5db1ff" text-anchor="middle" font-size="11">apply_channel_kernel read rule for slot N (per output sample, per tap)</text>
    <text x="500" y="278" fill="#cdd6e6" text-anchor="middle" font-size="10">read_idx ∈ [0, count)    → in_buffer[k·count + read_idx]    (this slot)</text>
    <text x="500" y="292" fill="#cdd6e6" text-anchor="middle" font-size="10">read_idx ∈ [−dl_size, 0) → delay_line[dl_size + read_idx]   (slot N−1's tail)</text>
    <text x="500" y="305" fill="#9aa7bd" text-anchor="middle" font-size="9">read_idx &lt; −dl_size      → 0 (only triggers on the very first slot)        +    slot_start_samples += count (Jakes phase continuity)</text>
  </svg>

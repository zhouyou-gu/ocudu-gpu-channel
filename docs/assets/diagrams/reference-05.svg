<svg font-family="SF Mono,Menlo,monospace" font-size="12" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
<text fill="#9aa7bd" x="20" y="22">Per-source IQ rings (one per radio TX) · sequence-tagged samples 0, 1, 2, …</text>
<!-- Ring src 0 -->
<text fill="#6fd08c" font-size="11" x="20" y="58">src 0 ring</text>
<g fill="#1a2233" stroke="#2c3850">
<rect height="28" width="40" x="100" y="42"></rect>
<rect height="28" width="40" x="140" y="42"></rect>
<rect height="28" width="40" x="180" y="42"></rect>
<rect height="28" width="40" x="220" y="42"></rect>
<rect height="28" width="40" x="260" y="42"></rect>
<rect height="28" width="40" x="300" y="42"></rect>
<rect height="28" width="40" x="340" y="42"></rect>
<rect height="28" width="40" x="380" y="42"></rect>
</g>
<g fill="#e7ecf5" font-size="11" text-anchor="middle">
<text x="120" y="60">0</text>
<text x="160" y="60">1</text>
<text x="200" y="60">2</text>
<text x="240" y="60">3</text>
<text x="280" y="60">4</text>
<text x="320" y="60">5</text>
<text x="360" y="60">6</text>
<text x="400" y="60">7</text>
</g>
<text fill="#9aa7bd" font-size="11" x="438" y="60">… next_seq</text>
<!-- Ring src 1 -->
<text fill="#6fd08c" font-size="11" x="20" y="116">src 1 ring</text>
<g fill="#1a2233" stroke="#2c3850">
<rect height="28" width="40" x="100" y="100"></rect>
<rect height="28" width="40" x="140" y="100"></rect>
<rect height="28" width="40" x="180" y="100"></rect>
<rect height="28" width="40" x="220" y="100"></rect>
<rect height="28" width="40" x="260" y="100"></rect>
<rect height="28" width="40" x="300" y="100"></rect>
</g>
<g fill="#e7ecf5" font-size="11" text-anchor="middle">
<text x="120" y="118">0</text>
<text x="160" y="118">1</text>
<text x="200" y="118">2</text>
<text x="240" y="118">3</text>
<text x="280" y="118">4</text>
<text x="320" y="118">5</text>
</g>
<text fill="#9aa7bd" font-size="11" x="358" y="118">… next_seq</text>
<!-- Common window highlight (HIGHLIGHT modifier: translucent amber + amber dashed border) -->
<rect fill="rgba(255,180,84,0.12)" height="104" stroke="#ffb454" stroke-dasharray="4 3" width="244" x="98" y="34"></rect>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="220" y="158">common window = min(batch, min over k of (next_seq − cursor))</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="220" y="174">(here 6 samples — src 1's ring limits the window)</text>
<!-- Cursor marker: orange arrow pointing up at column 0 from below the rings -->
<g fill="#ffb454" stroke="#ffb454" stroke-width="2">
<line x1="120" x2="120" y1="148" y2="142"></line>
<polygon points="120,138 114,148 126,148"></polygon>
</g>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="120" y="190">cursor_k</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="120" y="204">(seq 0 on 1st serve = epoch)</text>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="500" y="222">→ after serve: every cursor += 6 (lockstep advance across all edges)</text>
<!-- Time discipline panel on right - simplified to virtual-time formula only -->
<rect fill="#1a2233" height="90" rx="6" stroke="#2c3850" width="380" x="600" y="42"></rect>
<text fill="#ffb454" text-anchor="middle" x="790" y="64">Time discipline</text>
<text fill="#cdd6e6" font-size="11" x="620" y="92">virtual time of dst[idx]:</text>
<text fill="#5db1ff" font-size="13" x="620" y="116">  t = (cursor_start + idx) / sample_rate</text>
<text fill="#cdd6e6" font-size="11" text-anchor="middle" x="500" y="244">Same column index across rings = same source-time instant — that is what makes superposition physical.</text>
</svg>

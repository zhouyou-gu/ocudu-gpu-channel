<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 700 380" font-family="SF Mono,Menlo,monospace" font-size="12">
    <defs>
      <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#6fd08c"/>
      </marker>
      <marker id="argx" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#ffb454"/>
      </marker>
    </defs>

    <text x="20" y="20" fill="#9aa7bd" font-size="11">3-node graph · use_cases/configs/topologies/basic/topology.graph.cuda.yaml · 6 edges total</text>

    <!-- nodes: EXTERNAL class (gnb0, ue0, ue1 are external SDR endpoints) -->
    <circle cx="350" cy="90" r="42" fill="#181f2e" stroke="#cdd6e6" stroke-width="2"/>
    <text x="350" y="88" fill="#e7ecf5" text-anchor="middle">gnb0</text>
    <text x="350" y="104" fill="#9aa7bd" text-anchor="middle" font-size="10">gNB</text>

    <circle cx="160" cy="280" r="42" fill="#181f2e" stroke="#cdd6e6" stroke-width="2"/>
    <text x="160" y="278" fill="#e7ecf5" text-anchor="middle">ue0</text>
    <text x="160" y="294" fill="#9aa7bd" text-anchor="middle" font-size="10">UE</text>

    <circle cx="540" cy="280" r="42" fill="#181f2e" stroke="#cdd6e6" stroke-width="2"/>
    <text x="540" y="278" fill="#e7ecf5" text-anchor="middle">ue1</text>
    <text x="540" y="294" fill="#9aa7bd" text-anchor="middle" font-size="10">UE</text>

    <!-- desired links (primary flow): solid green = host transport -->
    <!-- gnb0 -> ue0 -->
    <path d="M 322 118 Q 235 180 188 246" stroke="#6fd08c" stroke-width="1.6" fill="none" marker-end="url(#arg)"/>
    <text x="208" y="180" fill="#6fd08c" font-size="10">desired DL</text>

    <!-- gnb0 -> ue1 -->
    <path d="M 378 118 Q 465 180 512 246" stroke="#6fd08c" stroke-width="1.6" fill="none" marker-end="url(#arg)"/>
    <text x="450" y="180" fill="#6fd08c" font-size="10">desired DL</text>

    <!-- ue0 -> gnb0 -->
    <path d="M 195 250 Q 280 185 322 128" stroke="#6fd08c" stroke-width="1.6" fill="none" marker-end="url(#arg)"/>
    <text x="215" y="225" fill="#6fd08c" font-size="10">desired UL</text>

    <!-- ue1 -> gnb0 -->
    <path d="M 505 250 Q 420 185 378 128" stroke="#6fd08c" stroke-width="1.6" fill="none" marker-end="url(#arg)"/>
    <text x="450" y="225" fill="#6fd08c" font-size="10">desired UL</text>

    <!-- crosstalk: dashed amber = annotation / secondary path (FALLBACK modifier visual) -->
    <path d="M 205 290 Q 350 340 495 290" stroke="#ffb454" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#argx)"/>
    <text x="350" y="335" fill="#ffb454" font-size="10" text-anchor="middle">crosstalk · −40 dB</text>
    <path d="M 495 270 Q 350 220 205 270" stroke="#ffb454" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#argx)"/>

    <!-- legend -->
    <g font-size="11">
      <line x1="20" y1="365" x2="40" y2="365" stroke="#6fd08c" stroke-width="1.6"/>
      <text x="46" y="369" fill="#9aa7bd">desired (tdl + phase + CFO)</text>
      <line x1="290" y1="365" x2="310" y2="365" stroke="#ffb454" stroke-width="1.6" stroke-dasharray="5 3"/>
      <text x="316" y="369" fill="#9aa7bd">crosstalk (path-loss + phase)</text>
      <text x="540" y="369" fill="#ffb454">+ rx_model per node</text>
    </g>
  </svg>

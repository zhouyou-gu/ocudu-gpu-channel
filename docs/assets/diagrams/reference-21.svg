<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 380" font-family="SF Mono,Menlo,monospace" font-size="12">
    <text x="20" y="22" fill="#9aa7bd" font-size="11">Diagram W · 1-N achieved H2D Gbps vs N · negotiated PCIe 5.0 x4 ceiling = 126 Gbps</text>

    <!-- axes -->
    <line x1="100" y1="50" x2="100" y2="320" stroke="#9aa7bd"/>
    <line x1="100" y1="320" x2="960" y2="320" stroke="#9aa7bd"/>

    <!-- Y ticks: 0, 25, 50, 75, 100, 125 (Gbps) -->
    <g fill="#9aa7bd" font-size="10" text-anchor="end">
      <text x="94" y="323">0</text>
      <text x="94" y="269">25</text>
      <text x="94" y="215">50</text>
      <text x="94" y="161">75</text>
      <text x="94" y="107">100</text>
      <text x="94" y="53">125</text>
    </g>
    <text x="32" y="200" fill="#9aa7bd" font-size="11" transform="rotate(-90 32 200)">H2D achieved Gbps (p99)</text>

    <!-- Reference line at 126 Gbps = y = 320 - 126/125 * 270 = 320 - 272 = 48 -->
    <line x1="100" y1="48" x2="900" y2="48" stroke="#ffb454" stroke-dasharray="4 3" stroke-width="1.4"/>
    <text x="990" y="44" fill="#ffb454" font-size="10" text-anchor="end">126 Gbps = PCIe 5.0 x4 effective ceiling (gen 5 x16 would be ~504 Gbps, 4× off-chart)</text>

    <!-- X same as before -->
    <g fill="#cdd6e6" font-size="11" text-anchor="middle">
      <text x="140" y="343">1</text>
      <text x="280" y="343">2</text>
      <text x="410" y="343">4</text>
      <text x="530" y="343">8</text>
      <text x="650" y="343">16</text>
      <text x="770" y="343">32</text>
      <text x="890" y="343">64</text>
    </g>
    <text x="500" y="365" fill="#9aa7bd" font-size="11" text-anchor="middle">N = incoming edges (log scale) · bytes per H2D = N × 180 KiB</text>

    <!-- y(gbps) = 320 - gbps * 270 / 125 = 320 - gbps * 2.16
       Post-D4 Gbps:  51.3, 75.9, 85.6, 97.5, 103.3, 106.0, 106.5
       y:             209.2, 156.1, 135.1, 109.4, 96.9, 91.0, 90.0
       (Pre-D4 was 56.9 / 73.2 / 86.3 / 99.2 / 103.2 / 106.0 / 106.7 —
        D4 unchanged for one-to-N because num_sources == N == link_count.) -->
    <polyline points="140,209.2 280,156.1 410,135.1 530,109.4 650,96.9 770,91.0 890,90.0"
              fill="none" stroke="#5db1ff" stroke-width="2.4"/>
    <g fill="#5db1ff">
      <circle cx="140" cy="209.2" r="4"/><circle cx="280" cy="156.1" r="4"/>
      <circle cx="410" cy="135.1" r="4"/><circle cx="530" cy="109.4" r="4"/>
      <circle cx="650" cy="96.9" r="4"/><circle cx="770" cy="91.0" r="4"/>
      <circle cx="890" cy="90.0" r="4"/>
    </g>
    <g fill="#5db1ff" font-size="9" text-anchor="middle">
      <text x="140" y="202">51</text>
      <text x="280" y="150">76</text>
      <text x="410" y="129">86</text>
      <text x="530" y="103">98</text>
      <text x="650" y="91">103</text>
      <text x="770" y="85">106</text>
      <text x="890" y="84">107</text>
    </g>

    <!-- Annotation: saturation regime (placed mid-chart to avoid the rightmost label) -->
    <path d="M 380 130 Q 500 110 620 100" fill="none" stroke="#ffb454" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="470" y="142" fill="#ffb454" font-size="10" text-anchor="middle">saturating ~85 % of x4 ceiling by N=8</text>
  </svg>

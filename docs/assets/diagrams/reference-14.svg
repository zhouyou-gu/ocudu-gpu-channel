<svg xmlns="http://www.w3.org/2000/svg" style="background:#0f1420;color:#e7ecf5;--bg:#0f1420;--panel:#1a2233;--ink:#e7ecf5;--muted:#9aa7bd;--edge:#2c3850;--accent:#5db1ff;--warm:#ffb454;--good:#6fd08c;--cell:#0b101a" viewBox="0 0 1000 340" font-family="SF Mono,Menlo,monospace" font-size="12">
    <defs>
      <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#5db1ff"/>
      </marker>
    </defs>
    <text x="20" y="22" fill="#9aa7bd">device_staged — every incoming edge's 23 040-sample batch, packed back to back</text>

    <!-- Row 0: edge 0 -->
    <text x="25" y="56" fill="#5db1ff" font-size="11">edge 0</text>
    <text x="72" y="56" fill="#9aa7bd" font-size="10">ue0 → gnb0</text>
    <g stroke="#2c3850">
      <rect x="140" y="40" width="28" height="24" fill="#1a2233"/>
      <rect x="168" y="40" width="28" height="24" fill="#1a2233"/>
      <rect x="196" y="40" width="28" height="24" fill="#1a2233"/>
      <rect x="224" y="40" width="28" height="24" fill="#2a2113"/>
      <rect x="252" y="40" width="28" height="24" fill="#1a2233"/>
      <rect x="280" y="40" width="28" height="24" fill="#1a2233"/>
    </g>
    <g fill="#e7ecf5" text-anchor="middle" font-size="11">
      <text x="154" y="56">s0</text>
      <text x="182" y="56">s1</text>
      <text x="210" y="56">s2</text>
      <text x="238" y="56" fill="#ffb454" font-size="9">s_idx</text>
      <text x="266" y="56">s4</text>
      <text x="294" y="56">s5</text>
    </g>
    <text x="324" y="56" fill="#9aa7bd" font-size="11">· · ·</text>
    <rect x="350" y="40" width="55" height="24" fill="#1a2233" stroke="#2c3850"/>
    <text x="377" y="56" fill="#9aa7bd" text-anchor="middle" font-size="11">s23039</text>

    <!-- Row 1: edge 1 -->
    <text x="25" y="86" fill="#5db1ff" font-size="11">edge 1</text>
    <text x="72" y="86" fill="#9aa7bd" font-size="10">ue1 → gnb0</text>
    <g stroke="#2c3850">
      <rect x="140" y="70" width="28" height="24" fill="#1a2233"/>
      <rect x="168" y="70" width="28" height="24" fill="#1a2233"/>
      <rect x="196" y="70" width="28" height="24" fill="#1a2233"/>
      <rect x="224" y="70" width="28" height="24" fill="#2a2113"/>
      <rect x="252" y="70" width="28" height="24" fill="#1a2233"/>
      <rect x="280" y="70" width="28" height="24" fill="#1a2233"/>
    </g>
    <g fill="#e7ecf5" text-anchor="middle" font-size="11">
      <text x="154" y="86">s0</text>
      <text x="182" y="86">s1</text>
      <text x="210" y="86">s2</text>
      <text x="238" y="86" fill="#ffb454" font-size="9">s_idx</text>
      <text x="266" y="86">s4</text>
      <text x="294" y="86">s5</text>
    </g>
    <text x="324" y="86" fill="#9aa7bd" font-size="11">· · ·</text>
    <rect x="350" y="70" width="55" height="24" fill="#1a2233" stroke="#2c3850"/>
    <text x="377" y="86" fill="#9aa7bd" text-anchor="middle" font-size="11">s23039</text>

    <!-- Vertical dots indicating more edges in between -->
    <text x="222" y="110" fill="#9aa7bd" font-size="11" text-anchor="middle">⋮</text>
    <text x="266" y="110" fill="#9aa7bd" font-size="10">(one row per incoming edge)</text>

    <!-- Row N−1 -->
    <text x="25" y="132" fill="#5db1ff" font-size="11">edge N−1</text>
    <text x="80" y="132" fill="#9aa7bd" font-size="10">src → node</text>
    <g stroke="#2c3850">
      <rect x="140" y="116" width="28" height="24" fill="#1a2233"/>
      <rect x="168" y="116" width="28" height="24" fill="#1a2233"/>
      <rect x="196" y="116" width="28" height="24" fill="#1a2233"/>
      <rect x="224" y="116" width="28" height="24" fill="#2a2113"/>
      <rect x="252" y="116" width="28" height="24" fill="#1a2233"/>
      <rect x="280" y="116" width="28" height="24" fill="#1a2233"/>
    </g>
    <g fill="#e7ecf5" text-anchor="middle" font-size="11">
      <text x="154" y="132">s0</text>
      <text x="182" y="132">s1</text>
      <text x="210" y="132">s2</text>
      <text x="238" y="132" fill="#ffb454" font-size="9">s_idx</text>
      <text x="266" y="132">s4</text>
      <text x="294" y="132">s5</text>
    </g>
    <text x="324" y="132" fill="#9aa7bd" font-size="11">· · ·</text>
    <rect x="350" y="116" width="55" height="24" fill="#1a2233" stroke="#2c3850"/>
    <text x="377" y="132" fill="#9aa7bd" text-anchor="middle" font-size="11">s23039</text>

    <!-- Column highlight: dashed bracket around the s_idx column across all rows -->
    <rect x="222" y="38" width="32" height="104" fill="none" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="238" y="160" fill="#ffb454" text-anchor="middle" font-size="11">column idx</text>
    <text x="238" y="174" fill="#9aa7bd" text-anchor="middle" font-size="10">(same source-time instant on every edge)</text>

    <g>
      <rect x="540" y="40" width="430" height="210" rx="8" fill="#0b101a" stroke="#5db1ff"/>
      <text x="560" y="64" fill="#5db1ff">thread idx   —   computes dst[idx]</text>
      <text x="560" y="92"  fill="#e7ecf5">acc = (0, 0)</text>
      <text x="560" y="116" fill="#cdd6e6">for k in 0 … N-1:</text>
      <text x="582" y="140" fill="#5db1ff">s = staged[k·count + idx]</text>
      <text x="582" y="164" fill="#5db1ff">apply_chain(s, steps + step_meta[k],</text>
      <text x="652" y="180" fill="#5db1ff">step_meta[N+k], idx)</text>
      <text x="600" y="200" fill="#9aa7bd" font-size="11">scale ·  rotate sincos  ·  AWGN (Philox)</text>
      <text x="582" y="222" fill="#ffb454">acc += s</text>
      <text x="560" y="244" fill="#e7ecf5">dst[idx] = acc</text>
    </g>
    <!-- arrows from the highlighted column (right edge x=254) into the thread box -->
    <g stroke="#5db1ff" marker-end="url(#ar2)">
      <line x1="254" y1="52"  x2="536" y2="120"/>
      <line x1="254" y1="82"  x2="536" y2="135"/>
      <line x1="254" y1="128" x2="536" y2="150"/>
    </g>
    <rect x="540" y="268" width="430" height="34" rx="4" fill="#0b101a" stroke="#5db1ff"/>
    <text x="755" y="284" fill="#5db1ff" text-anchor="middle" font-size="11">device_output[0 … 23039]</text>
    <text x="755" y="297" fill="#9aa7bd" text-anchor="middle" font-size="10">node's RX signal · all threads' writes</text>
    <line x1="755" y1="250" x2="755" y2="268" stroke="#5db1ff" marker-end="url(#ar2)"/>
    <text x="20" y="300" fill="#cdd6e6">desired, interference, and crosstalk are the same operation:</text>
    <text x="20" y="320" fill="#cdd6e6">every term of dst[idx] is one edge arriving at the node.</text>
  </svg>

<svg font-family="SF Mono,Menlo,monospace" font-size="12" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar2" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="4.5">
<path d="M0,0 L9,4.5 L0,9 z" fill="#5db1ff"></path>
</marker>
</defs>
<text fill="#9aa7bd" x="20" y="22">device_staged — every incoming edge's 23 040-sample batch, packed back to back</text>
<!-- Row 0: edge 0 -->
<text fill="#5db1ff" font-size="11" x="25" y="56">edge 0</text>
<text fill="#9aa7bd" font-size="10" x="72" y="56">ue0 → gnb0</text>
<g stroke="#2c3850">
<rect fill="#1a2233" height="24" width="28" x="140" y="40"></rect>
<rect fill="#1a2233" height="24" width="28" x="168" y="40"></rect>
<rect fill="#1a2233" height="24" width="28" x="196" y="40"></rect>
<rect fill="#2a2113" height="24" width="28" x="224" y="40"></rect>
<rect fill="#1a2233" height="24" width="28" x="252" y="40"></rect>
<rect fill="#1a2233" height="24" width="28" x="280" y="40"></rect>
</g>
<g fill="#e7ecf5" font-size="11" text-anchor="middle">
<text x="154" y="56">s0</text>
<text x="182" y="56">s1</text>
<text x="210" y="56">s2</text>
<text fill="#ffb454" font-size="9" x="238" y="56">s_idx</text>
<text x="266" y="56">s4</text>
<text x="294" y="56">s5</text>
</g>
<text fill="#9aa7bd" font-size="11" x="324" y="56">· · ·</text>
<rect fill="#1a2233" height="24" stroke="#2c3850" width="55" x="350" y="40"></rect>
<text fill="#9aa7bd" font-size="11" text-anchor="middle" x="377" y="56">s23039</text>
<!-- Row 1: edge 1 -->
<text fill="#5db1ff" font-size="11" x="25" y="86">edge 1</text>
<text fill="#9aa7bd" font-size="10" x="72" y="86">ue1 → gnb0</text>
<g stroke="#2c3850">
<rect fill="#1a2233" height="24" width="28" x="140" y="70"></rect>
<rect fill="#1a2233" height="24" width="28" x="168" y="70"></rect>
<rect fill="#1a2233" height="24" width="28" x="196" y="70"></rect>
<rect fill="#2a2113" height="24" width="28" x="224" y="70"></rect>
<rect fill="#1a2233" height="24" width="28" x="252" y="70"></rect>
<rect fill="#1a2233" height="24" width="28" x="280" y="70"></rect>
</g>
<g fill="#e7ecf5" font-size="11" text-anchor="middle">
<text x="154" y="86">s0</text>
<text x="182" y="86">s1</text>
<text x="210" y="86">s2</text>
<text fill="#ffb454" font-size="9" x="238" y="86">s_idx</text>
<text x="266" y="86">s4</text>
<text x="294" y="86">s5</text>
</g>
<text fill="#9aa7bd" font-size="11" x="324" y="86">· · ·</text>
<rect fill="#1a2233" height="24" stroke="#2c3850" width="55" x="350" y="70"></rect>
<text fill="#9aa7bd" font-size="11" text-anchor="middle" x="377" y="86">s23039</text>
<!-- Vertical dots indicating more edges in between -->
<text fill="#9aa7bd" font-size="11" text-anchor="middle" x="222" y="110">⋮</text>
<text fill="#9aa7bd" font-size="10" x="266" y="110">(one row per incoming edge)</text>
<!-- Row N−1 -->
<text fill="#5db1ff" font-size="11" x="25" y="132">edge N−1</text>
<text fill="#9aa7bd" font-size="10" x="80" y="132">src → node</text>
<g stroke="#2c3850">
<rect fill="#1a2233" height="24" width="28" x="140" y="116"></rect>
<rect fill="#1a2233" height="24" width="28" x="168" y="116"></rect>
<rect fill="#1a2233" height="24" width="28" x="196" y="116"></rect>
<rect fill="#2a2113" height="24" width="28" x="224" y="116"></rect>
<rect fill="#1a2233" height="24" width="28" x="252" y="116"></rect>
<rect fill="#1a2233" height="24" width="28" x="280" y="116"></rect>
</g>
<g fill="#e7ecf5" font-size="11" text-anchor="middle">
<text x="154" y="132">s0</text>
<text x="182" y="132">s1</text>
<text x="210" y="132">s2</text>
<text fill="#ffb454" font-size="9" x="238" y="132">s_idx</text>
<text x="266" y="132">s4</text>
<text x="294" y="132">s5</text>
</g>
<text fill="#9aa7bd" font-size="11" x="324" y="132">· · ·</text>
<rect fill="#1a2233" height="24" stroke="#2c3850" width="55" x="350" y="116"></rect>
<text fill="#9aa7bd" font-size="11" text-anchor="middle" x="377" y="132">s23039</text>
<!-- Column highlight: dashed bracket around the s_idx column across all rows -->
<rect fill="none" height="104" stroke="#ffb454" stroke-dasharray="4 2" stroke-width="1.5" width="32" x="222" y="38"></rect>
<text fill="#ffb454" font-size="11" text-anchor="middle" x="238" y="160">column idx</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="238" y="174">(same source-time instant on every edge)</text>
<g>
<rect fill="#0b101a" height="210" rx="8" stroke="#5db1ff" width="430" x="540" y="40"></rect>
<text fill="#5db1ff" x="560" y="64">thread idx   —   computes dst[idx]</text>
<text fill="#e7ecf5" x="560" y="92">acc = (0, 0)</text>
<text fill="#cdd6e6" x="560" y="116">for k in 0 … N-1:</text>
<text fill="#5db1ff" x="582" y="140">s = staged[k·count + idx]</text>
<text fill="#5db1ff" x="582" y="164">apply_chain(s, steps + step_meta[k],</text>
<text fill="#5db1ff" x="652" y="180">step_meta[N+k], idx)</text>
<text fill="#9aa7bd" font-size="11" x="600" y="200">scale ·  rotate sincos  ·  AWGN (Philox)</text>
<text fill="#ffb454" x="582" y="222">acc += s</text>
<text fill="#e7ecf5" x="560" y="244">dst[idx] = acc</text>
</g>
<!-- arrows from the highlighted column (right edge x=254) into the thread box -->
<g marker-end="url(#ar2)" stroke="#5db1ff">
<line x1="254" x2="536" y1="52" y2="120"></line>
<line x1="254" x2="536" y1="82" y2="135"></line>
<line x1="254" x2="536" y1="128" y2="150"></line>
</g>
<rect fill="#0b101a" height="34" rx="4" stroke="#5db1ff" width="430" x="540" y="268"></rect>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="755" y="284">device_output[0 … 23039]</text>
<text fill="#9aa7bd" font-size="10" text-anchor="middle" x="755" y="297">node's RX signal · all threads' writes</text>
<line marker-end="url(#ar2)" stroke="#5db1ff" x1="755" x2="755" y1="250" y2="268"></line>
<text fill="#cdd6e6" x="20" y="300">desired, interference, and crosstalk are the same operation:</text>
<text fill="#cdd6e6" x="20" y="320">every term of dst[idx] is one edge arriving at the node.</text>
</svg>

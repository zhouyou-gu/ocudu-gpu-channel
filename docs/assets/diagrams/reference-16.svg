<svg font-family="SF Mono,Menlo,monospace" font-size="12" style="background:#0f1420;color:#e7ecf5;max-width:100%;height:auto" viewbox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ard" markerheight="9" markerwidth="9" orient="auto" refx="8" refy="4.5">
<path d="M0,0 L9,4.5 L0,9 z" fill="#5db1ff"></path>
</marker>
</defs>
<text fill="#9aa7bd" text-anchor="middle" x="200" y="20">HOST</text>
<text fill="#9aa7bd" text-anchor="middle" x="500" y="20">PCIe · cudaMemcpyAsync</text>
<text fill="#5db1ff" text-anchor="middle" x="800" y="20">DEVICE · global (cudaMalloc)</text>
<text fill="#ffb454" font-size="13" x="20" y="44">CudaSuperposeState — one per RX node · preallocated in prepare() · reused every serve</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#6fd08c" width="360" x="20" y="58"></rect>
<text fill="#e7ecf5" x="30" y="75">host_staged <tspan fill="#5db1ff" font-size="10.5">· pinned</tspan></text>
<text fill="#9aa7bd" font-size="10.5" x="30" y="89">N × 23 040 IQ   (180 KiB per edge)</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#5db1ff" width="360" x="620" y="58"></rect>
<text fill="#e7ecf5" x="630" y="75">device_staged</text>
<text fill="#9aa7bd" font-size="10.5" x="630" y="89">N × 23 040 IQ   (kernel reads staged[k·count + idx])</text>
<line marker-end="url(#ard)" stroke="#5db1ff" x1="384" x2="614" y1="77" y2="77"></line>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="499" y="73">H2D · samples</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#6fd08c" width="360" x="20" y="104"></rect>
<text fill="#e7ecf5" x="30" y="121">host_steps <tspan fill="#9aa7bd" font-size="10.5">· std::vector (heap)</tspan></text>
<text fill="#9aa7bd" font-size="10.5" x="30" y="135">Σ steps × GpuStep   (flattened per-edge chains)</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#5db1ff" width="360" x="620" y="104"></rect>
<text fill="#e7ecf5" x="630" y="121">device_steps</text>
<text fill="#9aa7bd" font-size="10.5" x="630" y="135">Σ steps × GpuStep</text>
<line marker-end="url(#ard)" stroke="#5db1ff" x1="384" x2="614" y1="123" y2="123"></line>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="499" y="119">H2D · chain</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#6fd08c" width="360" x="20" y="150"></rect>
<text fill="#e7ecf5" x="30" y="167">host_step_meta <tspan fill="#9aa7bd" font-size="10.5">· std::vector (heap)</tspan></text>
<text fill="#9aa7bd" font-size="10.5" x="30" y="181">2N × int   (first N: offsets · next N: counts)</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#5db1ff" width="360" x="620" y="150"></rect>
<text fill="#e7ecf5" x="630" y="167">device_step_meta</text>
<text fill="#9aa7bd" font-size="10.5" x="630" y="181">2N × int</text>
<line marker-end="url(#ard)" stroke="#5db1ff" x1="384" x2="614" y1="169" y2="169"></line>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="499" y="165">H2D · meta</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#6fd08c" stroke-dasharray="4 3" width="360" x="20" y="196"></rect>
<text fill="#cdd6e6" x="30" y="213">rx_model.host_steps <tspan fill="#9aa7bd" font-size="10.5">· optional</tspan></text>
<text fill="#9aa7bd" font-size="10.5" x="30" y="227">noise-floor chain · only when node has rx_model</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#5db1ff" stroke-dasharray="4 3" width="360" x="620" y="196"></rect>
<text fill="#cdd6e6" x="630" y="213">device_rx_steps</text>
<text fill="#9aa7bd" font-size="10.5" x="630" y="227">consumed by the in-place apply_steps_kernel pass</text>
<line marker-end="url(#ard)" stroke="#5db1ff" stroke-dasharray="4 3" x1="384" x2="614" y1="215" y2="215"></line>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="499" y="211">H2D · rx (opt)</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#6fd08c" width="360" x="20" y="242"></rect>
<text fill="#e7ecf5" x="30" y="259">host_output <tspan fill="#5db1ff" font-size="10.5">· pinned</tspan></text>
<text fill="#9aa7bd" font-size="10.5" x="30" y="273">23 040 IQ · the served signal</text>
<rect fill="#0b101a" height="38" rx="4" stroke="#5db1ff" width="360" x="620" y="242"></rect>
<text fill="#e7ecf5" x="630" y="259">device_output</text>
<text fill="#9aa7bd" font-size="10.5" x="630" y="273">23 040 IQ · kernel write target</text>
<line marker-end="url(#ard)" stroke="#5db1ff" x1="614" x2="384" y1="261" y2="261"></line>
<text fill="#5db1ff" font-size="11" text-anchor="middle" x="499" y="257">D2H · result</text>
<text fill="#9aa7bd" font-size="11" x="20" y="295">
<tspan dy="0" x="20">pinned buffers (cudaHostAlloc) let cudaMemcpyAsync DMA run truly asynchronously</tspan>
<tspan dy="14" x="20">heap vectors (chain + meta) are tiny — the sync vs async distinction does not matter for them</tspan>
</text>
</svg>

# boundary sweep: cells=1 ues=4 gnb_ports=1 ue_ports=1 srate=122880000 scs=30 taps=8
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 61440
  queue_samples: 1966080
devices:
  - id: gnb0_p0
    role: port
    sample_rate_hz: 122880000
    tx_endpoint: tcp://127.0.0.1:20000
    rx_endpoint: tcp://127.0.0.1:20001
    rx_model: rx_noise_gnb0
  - id: ue0_p0
    role: port
    sample_rate_hz: 122880000
    tx_endpoint: tcp://127.0.0.1:20002
    rx_endpoint: tcp://127.0.0.1:20003
    rx_model: rx_noise_ue0
  - id: ue1_p0
    role: port
    sample_rate_hz: 122880000
    tx_endpoint: tcp://127.0.0.1:20004
    rx_endpoint: tcp://127.0.0.1:20005
    rx_model: rx_noise_ue1
  - id: ue2_p0
    role: port
    sample_rate_hz: 122880000
    tx_endpoint: tcp://127.0.0.1:20006
    rx_endpoint: tcp://127.0.0.1:20007
    rx_model: rx_noise_ue2
  - id: ue3_p0
    role: port
    sample_rate_hz: 122880000
    tx_endpoint: tcp://127.0.0.1:20008
    rx_endpoint: tcp://127.0.0.1:20009
    rx_model: rx_noise_ue3
radio_nodes:
  - id: gnb0
    tx_ports:
      - gnb0_p0
    rx_ports:
      - gnb0_p0
  - id: ue0
    tx_ports:
      - ue0_p0
    rx_ports:
      - ue0_p0
  - id: ue1
    tx_ports:
      - ue1_p0
    rx_ports:
      - ue1_p0
  - id: ue2
    tx_ports:
      - ue2_p0
    rx_ports:
      - ue2_p0
  - id: ue3
    tx_ports:
      - ue3_p0
    rx_ports:
      - ue3_p0
links:
  - from: gnb0
    to: ue0
    model: tdl
  - from: ue0
    to: gnb0
    model: tdl
  - from: gnb0
    to: ue1
    model: tdl
  - from: ue1
    to: gnb0
    model: tdl
  - from: gnb0
    to: ue2
    model: tdl
  - from: ue2
    to: gnb0
    model: tdl
  - from: gnb0
    to: ue3
    model: tdl
  - from: ue3
    to: gnb0
    model: tdl
models:
  tdl:
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.000
            gain_db: -3.00
            phase_rad: 0.0000
          - delay_samples: 43.886
            gain_db: -5.43
            phase_rad: 2.3990
          - delay_samples: 87.771
            gain_db: -7.86
            phase_rad: 4.7980
          - delay_samples: 131.657
            gain_db: -10.29
            phase_rad: 0.9138
          - delay_samples: 175.543
            gain_db: -12.71
            phase_rad: 3.3128
          - delay_samples: 219.429
            gain_db: -15.14
            phase_rad: 5.7118
          - delay_samples: 263.314
            gain_db: -17.57
            phase_rad: 1.8276
          - delay_samples: 307.200
            gain_db: -20.00
            phase_rad: 4.2266
  rx_noise_gnb0:
    chain:
      - type: awgn
        noise_power: 3.0e-02
  rx_noise_ue0:
    chain:
      - type: awgn
        noise_power: 1.12e-06
  rx_noise_ue1:
    chain:
      - type: awgn
        noise_power: 1.12e-06
  rx_noise_ue2:
    chain:
      - type: awgn
        noise_power: 1.12e-06
  rx_noise_ue3:
    chain:
      - type: awgn
        noise_power: 1.12e-06


runtime:
  backend: cpu
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://127.0.0.1:2001
    tx_timing_offset_samples: 3
  - id: ue0
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2101
    rx_endpoint: tcp://127.0.0.1:2100
  - id: ue1
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2103
    rx_endpoint: tcp://127.0.0.1:2102
links:
  - from: gnb0
    to: ue0
    model: serving
  - from: gnb0
    to: ue1
    model: with_delay
  - from: ue0
    to: gnb0
    model: serving
  - from: ue1
    to: gnb0
    model: serving
models:
  serving:
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            phase_rad: 0.0
  with_delay:
    chain:
      - type: tdl
        taps:
          - delay_samples: 5.0
            gain_db: -3.0
            phase_rad: 0.0

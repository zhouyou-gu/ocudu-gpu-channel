
runtime:
  backend: cpu
  batch_samples: 1024
  queue_samples: 8192
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 1000000
    tx_endpoint: tcp://127.0.0.1:2000
    rx_endpoint: tcp://127.0.0.1:2001
  - id: ue0
    role: ue
    sample_rate_hz: 1000000
    tx_endpoint: tcp://127.0.0.1:2101
    rx_endpoint: tcp://127.0.0.1:2100
links:
  - from: gnb0
    to: ue0
    model: los_k_zero
  - from: ue0
    to: gnb0
    model: los_k_zero
models:
  los_k_zero:
    chain:
      - type: tdl
        fading:
          f_d_max_hz: 100.0
          spectrum: jakes
        taps:
          - delay_samples: 0.0
            gain_db: 0.0
            is_los: true
